<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Perfil: figura sobre fondo plano</title>
<style>html,body{margin:0;background:#fff}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { crearEscenario } from '../../3d/escenario.js';
import { Karateka3D, cargarPoses } from '../../3d/karateka3d.js';
const ctx = document.getElementById('c').getContext('2d');
const q = new URLSearchParams(location.search);
const esc = crearEscenario({ escala: 1, fondo: 'degradado' });
const k = new Karateka3D({ cinturon: 'negro' });
esc.escena.add(k.raiz);
const P = cargarPoses();
window.DURACION = 1;
esc.suelo.visible = false; esc.escena.fog = null;
k.colocar(0, 0, window.RUMBO ?? 12).aplicarPose(P.yoi);
k.cara({ sonrisa: 0.85, cejas: 0.35, parpadeo: 0 });
// t=0 fondo negro, t=1 fondo blanco (para sacar el alfa exacto)
window.render = (t) => {
  esc.escena.background = new esc.THREE.Color(t < 0.5 ? '#000000' : '#ffffff');
  esc.orbita({ centro: [0, 1.25, 0], distancia: 3.3, azimut: 0, elevacion: 2, fov: 26 });
  esc.dibujar(ctx, { vineta: false, grano: false });
};
</script></body></html>
