<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Poses 2026-11-24</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../marca.js"></script>
<script type="module">
// Hoja de revisión de las poses de 2026-11-24 (ascensor + puntúa-o-no). t = índice de vista.
import { crearEscenario } from '../escenario.js';
import { Karateka3D, cargarPoses } from '../karateka3d.js';
import { tumbar } from '../kumite3d.js';
const ctx = document.getElementById('c').getContext('2d');
const esc = crearEscenario({ escala: 0.5, suelo: 'tatami' });
const k = new Karateka3D({ cinturon: 'negro' }); esc.escena.add(k.raiz);
const P = cargarPoses();
const CP = { centro: [0, 0.9, 0], distancia: 7, azimut: 0, elevacion: 3, fov: 26 };
const VISTAS = [
  ['oi-zuki-migi', 90, CP], ['paso-nivel', 90, CP], ['paso-alto', 90, CP], ['paso-nivel', 0, CP], ['gyaku-zuki-jodan', 90, CP],
  ['espalda-tras-puno', 30, CP], ['barrido', 90, CP], ['puno-remate-bajo', 90, { ...CP, centro: [0, 0.75, 0] }],
  ['caido-de-espaldas', 90, { centro: [-0.6, 0.35, 0], distancia: 6, azimut: 0, elevacion: 5, fov: 26 }], ['oi-zuki-migi', 0, CP]
];
window.DURACION = VISTAS.length;
window.render = (t) => {
  const [pose, rumbo, cam] = VISTAS[Math.min(VISTAS.length - 1, Math.floor(t))];
  k.colocar(0, 0, rumbo);
  if (pose === 'caido-de-espaldas') tumbar(k, P, { f: 1 }); else k.aplicarPose(P[pose]);
  esc.orbita(cam); esc.dibujar(ctx, { grano: false });
  const m = k.medidas();
  EMAKI.texto(ctx, { lineas: pose, size: 60, y: 120 });
  EMAKI.texto(ctx, { lineas: `cadera ${m.alturaCadera.toFixed(2)} m · base ${m.base.toFixed(2)}`, size: 48, y: 1800, peso: 600 });
};
</script></body></html>
