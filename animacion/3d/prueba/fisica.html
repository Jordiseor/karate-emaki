<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba de diagrama de física 3D</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../marca.js"></script>
<script type="module">
// Zenkutsu de perfil con CdM, vertical, base y arco «26°». t = 0: de pie; 1–3 s: se inclina hasta 26° sobre la punta; 3–4 s: vuelve.
import { crearEscenario, util as U } from '../escenario.js';
import { Karateka3D, cargarPoses } from '../karateka3d.js';
import { Diagrama3D } from '../diagrama3d.js';
import { overlay } from '../overlay2d.js';

const ctx = document.getElementById('c').getContext('2d');
const esc = crearEscenario({ escala: 0.5 });
const k = new Karateka3D({ cinturon: 'negro' });
esc.escena.add(k.raiz);
const P = cargarPoses();
const d = new Diagrama3D(esc, k);
window.DURACION = 4;

// perfil: el personaje mira a la derecha de la pantalla (rumbo 90) y la cámara está de frente al plano del movimiento
k.colocar(-0.05, 0, 90).aplicarPose(P['zenkutsu-dachi']);
const ajuste = d.ajustarVuelco(26); // CdM algo adelantado (reparto 60/40 del dosier) → el vuelco hacia delante da 26°
console.log('ajuste CdM', ajuste.toFixed(3), 'm');

window.render = (t) => {
  const inc = 26 * U.easeInOut(U.prog(t, 1, 2.6)) * (1 - U.easeInOut(U.prog(t, 3.2, 3.9)));
  k.aplicarPose(P['zenkutsu-dachi'], { inclinar: inc });
  k.cara({ parpadeo: U.parpadeo(t, [0.5]), cejas: inc / 26 * 0.8, sonrisa: 0.2 });
  esc.orbita({ centro: [0.12, 0.95, 0], distancia: 7.4, azimut: 0, elevacion: 3, fov: 26 });

  d.limpiar();
  d.base({ alerta: U.prog(inc, 20, 26) });
  const c = d.cdm();
  // arco en la punta delantera: de la vertical a la línea punta → CdM. De pie mide el margen (26°); al inclinarse se cierra.
  const piv = d.pivote();
  d.linea(piv, c, { grosor: 0.007, alfa: 0.9 }); // línea punta → CdM
  d.arco({ centro: piv, desde: 0, hasta: c, radio: 0.42, texto: inc < 0.5 ? '26°' : '', distTexto: 1.0, desplazaTexto: [150, -35], tamTexto: 80 });
  if (t > 0.6 && t < 2.6) d.flecha({ desde: [-1.15, 1.25, 0], hacia: [-0.45, 1.25, 0], crecer: U.easeOut(U.prog(t, 0.6, 1.0)) });

  esc.dibujar(ctx);
  d.dibujar2D(ctx);
  overlay.titulo(ctx, t, { lineas: 'Hacia delante: [r]≈26°[/r]', t0: -1, size: 96 });
  overlay.letraPequena(ctx, 'Modelo simplificado: cuerpo rígido');
};
</script></body></html>
