<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../marca.js"></script>
<script type="module">
// Rollo: sale del suelo (0–0,6 s), se desenrolla (0,6–1,4), viñetas con desplazamiento de 0,25 s (2,0 · 2,7 · 3,4),
// se enrolla (4,0–4,5) hacia el centro y se ata (4,6–5,2). Viñeta 0: karateka en yoi; 1: marco vacío; 2: zenkutsu de perfil; 3: marco.
import { ctx, crearEscenario, Karateka3D, cargarPoses, crearRollo, U } from './base.js';
const esc = crearEscenario({ escala: 0.5 });
const P = cargarPoses();
const k = new Karateka3D({ cinturon: 'negro' }); esc.escena.add(k.raiz);
const rollo = crearRollo();
window.DURACION = 5.6;
// Viñetas: pintan a pantalla completa; el rollo usa solo la ventana (x 60–1020, y 300–1500): encuadra al centro (540, 900).
const frontal = (c) => { k.colocar(0, 0, 0).aplicarPose(P.yoi); k.cara({ sonrisa: 0.6 }); esc.orbita({ centro: [0, 0.95, 0], distancia: 6.2, elevacion: 4, fov: 26 }); esc.dibujar(c); };
const perfil = (c) => { k.colocar(0, 0, 90).aplicarPose(P['zenkutsu-dachi']); k.cara({ cejas: -0.4 }); esc.orbita({ centro: [0.1, 0.95, 0], distancia: 7.2, elevacion: 3, fov: 26 }); esc.dibujar(c); };
window.render = (t) => {
  window.EMAKI.fondoPapel(ctx);
  const sube = U.easeOut(U.prog(t, 0, 0.6));
  const abierto = U.easeInOut(U.prog(t, 0.6, 1.4)) * (1 - U.easeInOut(U.prog(t, 4.0, 4.5)));
  const avance = rollo.avance(t, [2.0, 2.7, 3.4]);
  const marco = (t0) => ({ marco: U.prog(t, t0, t0 + 0.6) });
  if (t < 4.5) rollo.dibujar(ctx, { abierto, avance, centrar: 1, escala: U.lerp(0.55, 1, sube), y: (1 - sube) * 900, vinetas: [frontal, marco(2.1), perfil, marco(3.5)] });
  else rollo.cerrado(ctx, { x: 540, y: 900, atado: U.prog(t, 4.6, 5.2) });
  if (t > 2.0 && t < 2.6) rollo.etiqueta(ctx, 'Técnica', { prog: U.prog(t, 2.15, 2.4) });
};
</script></body></html>
