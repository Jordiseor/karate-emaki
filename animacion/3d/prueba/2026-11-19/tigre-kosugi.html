<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../marca.js"></script>
<script type="module">
import { ctx, escenario, crearMaestro, anadirMaestro, cargarPoses } from '../historia/base.js';
const esc = escenario({ fondo: 'degradado' });
const P = cargarPoses();
const m = anadirMaestro(esc, crearMaestro({ silueta: '#1A1A1A' }));
window.DURACION = 3;
window.render = (t) => {
  window.EMAKI.fondoPapel(ctx);
  m.colocar(0, 0, 150).pose(P, 'maestro-seiza-pincel', { escribir: t });
  esc.orbita({ centro: [0, 0.65, 0], distancia: 3.6, azimut: 0, elevacion: 8, fov: 34 });
  esc.dibujar(ctx);
};
</script></body></html>
