<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba de estilo 3D</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../marca.js"></script>
<script type="module">
import { crearEscenario, util as U, COLOR } from '../escenario.js';
import { Karateka3D, cargarPoses, mezclar } from '../karateka3d.js';

const ctx = document.getElementById('c').getContext('2d');
const esc = crearEscenario({ escala: 0.5 });
const k = new Karateka3D({ cinturon: 'negro' });
esc.escena.add(k.raiz);
const P = cargarPoses();
window.DURACION = 4.5;

// El karateka avanza en diagonal hacia la derecha y hacia la cámara (62°), vista de 3/4 casi de perfil (se lee bien la posición); el pie derecho (el de atrás) no se mueve al dar el paso.
const RUMBO = 62;
k.colocar(0, 0, RUMBO).aplicarPose(P.yoi);
const pieD = k.punto('tobilloD');
const ANCLA = { pie: 'D', x: pieD.x, z: pieD.z };

// Línea de tiempo (s): yoi → paso + preparación → gedan-barai → mantener, sonreír, parpadear.
const T = { paso: [0.6, 1.5], prep: [0.6, 1.3], golpe: [1.38, 1.62] };
function poseEn(t) {
  const fp = U.easeInOut(U.prog(t, ...T.paso));
  const fa = U.easeInOut(U.prog(t, ...T.prep));
  const fg = U.easeOut(U.prog(t, ...T.golpe));
  // brazos: yoi → preparación → final (gedan-barai + hikite); piernas: yoi → zenkutsu
  const brazos = fg > 0 ? mezclar(P['gedan-barai-prep'], P['zenkutsu-dachi'], fg) : mezclar(P.yoi, P['gedan-barai-prep'], fa);
  const piernas = mezclar(P.yoi, P['zenkutsu-dachi'], fp);
  const p = mezclar(piernas, brazos, { brazos: 1, tronco: fg > 0 ? 1 : fa * 0 + 1, cabeza: 0, piernas: 0 });
  p.tronco = mezclar({ tronco: (fg > 0 ? P['gedan-barai-prep'] : P.yoi).tronco || {} }, { tronco: (fg > 0 ? P['zenkutsu-dachi'] : P['gedan-barai-prep']).tronco || {} }, fg > 0 ? fg : fa).tronco;
  // el pie que avanza se levanta un poco a mitad del paso
  const arco = Math.sin(Math.PI * fp);
  p.piernaI = { ...p.piernaI, adelante: p.piernaI.adelante + 16 * arco };
  p.rodillaI += 26 * arco;
  p.tobilloI = { ...p.tobilloI, flex: (p.tobilloI.flex || 0) - 8 * arco };
  // cabeza: mira al frente, pequeño asentimiento amable al final
  const nod = Math.sin(Math.PI * U.prog(t, 2.55, 3.15)) * 6;
  // … y al final mira a cámara un momento (gesto amable)
  const mira = U.suave(U.prog(t, 2.35, 2.8)) + 0.9 * (1 - U.suave(U.prog(t, 0.45, 0.85))); // también al empezar, en yoi
  p.cabeza = { giro: U.lerp(P.yoi.cabeza?.giro || 0, P['zenkutsu-dachi'].cabeza?.giro ?? 0, fp) - 34 * mira, inclina: (P['zenkutsu-dachi'].cabeza?.inclina || 0) * fp + nod, ladeo: -6 * mira };
  // caídas del cinturón: se balancean con el paso y tras el golpe
  const tg = t - T.golpe[1];
  const cinta = { x: -14 * arco + (tg > 0 ? 9 * Math.exp(-tg * 3.5) * Math.sin(tg * 13) : 0), z: tg > 0 ? -6 * Math.exp(-tg * 3) * Math.sin(tg * 11 + 1) : 0 };
  return { p, op: { ancla: ANCLA, cinta } };
}

function camara(t) {
  const f = U.suave(U.prog(t, 0, window.DURACION));
  const fx = U.suave(U.prog(t, 0.5, 1.9));
  // la cámara sigue a la cadera (suave porque la pose lo es): el personaje queda centrado durante el paso
  const e = poseEn(t); k.aplicarPose(e.p, e.op); const c = k.punto('cadera'); void fx;
  esc.orbita({ centro: [c.x, 1.1, c.z * 0.5], distancia: U.lerp(7.4, 6.8, f), azimut: U.lerp(12, 4, f), elevacion: U.lerp(5, 3, f), fov: 26 });
}

// rastro rojo del puño durante el gedan-barai (acento de golpe)
function rastro(t) {
  const t0 = T.golpe[0] + 0.07, fin = T.golpe[1] + 0.3;
  if (t < t0 || t > fin) return;
  const desde = Math.max(t0, t - 0.22), hasta = Math.min(t, T.golpe[1]), n = 14, pts = [];
  for (let i = 0; i <= n; i++) { const ti = desde + (hasta - desde) * i / n; const e = poseEn(ti); k.aplicarPose(e.p, e.op); pts.push(esc.proyectar(k.punto('manoI'))); }
  const a = 1 - U.prog(t, T.golpe[1] + 0.05, fin);
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = COLOR.rojo;
  for (let i = 1; i < pts.length; i++) { ctx.globalAlpha = a * (i / pts.length) * 0.9; ctx.lineWidth = 4 + 22 * (i / pts.length); ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke(); }
  ctx.restore();
}

window.render = (t) => {
  camara(t);
  const e = poseEn(t);
  k.aplicarPose(e.p, e.op);
  k.cara({
    parpadeo: U.parpadeo(t, [0.35, 1.95, 3.55]),
    sonrisa: U.suave(U.prog(t, 2.3, 2.8)) * 0.75,
    cejas: 0.6 * U.suave(U.prog(t, 2.3, 2.7)) - 0.5 * Math.sin(Math.PI * U.prog(t, 1.3, 1.9)),
    mirada: [-0.8 * U.suave(U.prog(t, 2.35, 2.7)) - 0.7 * (1 - U.suave(U.prog(t, 0.45, 0.8))), -0.2 * U.suave(U.prog(t, 1.2, 1.6)) * (1 - U.prog(t, 2.2, 2.6))]
  });
  esc.dibujar(ctx);
  rastro(t);
  k.aplicarPose(e.p, e.op);
  EMAKI.tarjeta(ctx, t, { t0: 0.15, lineas: ['¿Por qué aguanta', 'el zenkutsu?'], size: 96, y: 270, sombra: 'rgba(244,239,230,0.95)' });
};
</script></body></html>
