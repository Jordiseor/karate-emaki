<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../marca.js"></script>
<script type="module">
import { ctx, escenario, ambiente, crearCasa, crearAlumno, cargarPoses, H2, U } from './base.js';
const esc = escenario({ fondo: 'degradado' });
ambiente(esc, 'calle');
const casa = crearCasa({ rotulo: '' }); esc.escena.add(casa.raiz);
const P = cargarPoses();
const a = crearAlumno(1, { peinado: 'corto' }), b = crearAlumno(2, { peinado: 'mono' }); esc.escena.add(a.raiz, b.raiz);
window.DURACION = 3;
window.render = (t) => {
  casa.escribirRotulo('松濤館', U.clamp(t / 2));
  a.colocar(-0.7, 2.75, 180).aplicarPose(P['brazos-arriba']); b.colocar(0.7, 2.75, 180).aplicarPose(P['brazos-arriba']);
  esc.orbita({ centro: [0, 2.0, 2.4], distancia: 7.5, azimut: 8, elevacion: 4, fov: 32 });
  esc.dibujar(ctx);
  H2.pergamino(ctx, t, { t0: 0, t1: 0.6 });
};
</script></body></html>
