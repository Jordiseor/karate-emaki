<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../marca.js"></script>
<script type="module">
import { ctx, escenario, ambiente, crearCasa, crearCalle } from './base.js';
const esc = escenario({ fondo: 'degradado' });
ambiente(esc, 'calle');
const calle = crearCalle({ porLado: 2 }); esc.escena.add(calle.raiz);
const casa = crearCasa({ rotulo: '' }); esc.escena.add(casa.raiz);
window.DURACION = 4;
window.render = (t) => {
  casa.construir(t / 2);
  esc.orbita({ centro: [0, 2.0, 0], distancia: 21, azimut: 22, elevacion: 10, fov: 30 });
  esc.dibujar(ctx);
};
</script></body></html>
