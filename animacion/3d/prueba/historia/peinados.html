<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../marca.js"></script>
<script type="module">
import { ctx, escenario, crearAlumno, crearMaestro, anadirMaestro, cargarPoses } from './base.js';
const esc = escenario({ fondo: 'degradado' });
const P = cargarPoses();
const pe = ['corto', 'rapado', 'flequillo', 'melena', 'mono', 'normal'];
const ks = pe.map((p, i) => { const k = crearAlumno(i, { peinado: p }); esc.escena.add(k.raiz); return k; });
window.DURACION = 2;
window.render = (t) => {
  ks.forEach((k, i) => { k.colocar(((i % 3) - 1) * 0.95, Math.floor(i / 3) * -1.4, t < 1 ? 15 : 160).aplicarPose(P.yoi); k.cara({ sonrisa: 0.4 }); });
  esc.orbita({ centro: [0, 1.3, -0.7], distancia: 6.5, azimut: 0, elevacion: 14, fov: 30 });
  esc.dibujar(ctx);
};
</script></body></html>
