<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Poses 2026-11-18</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../marca.js"></script>
<script type="module">
// Hoja de revisión: tiempo de contacto (empuje-recto, encoge-hombros) y seiza (seiza, seiza-alto, en-cuclillas-medio, manos-rodillas, levantarse-vacilando).
import { crearEscenario } from '../escenario.js';
import { Karateka3D, cargarPoses, mezclar } from '../karateka3d.js';
const ctx = document.getElementById('c').getContext('2d');
const esc = crearEscenario({ escala: 0.5 });
const P = cargarPoses();
const k = new Karateka3D({ cinturon: 'naranja' }); esc.escena.add(k.raiz);
const cam = (c, d = 7, el = 3, az = 0, fov = 26) => ({ centro: c, distancia: d, azimut: az, elevacion: el, fov });
const SZ = (p) => ({ suelo: false, altura: P[p].aplicar.altura });
// [rótulo, pose, rumbo, op, cámara, cara]
const VISTAS = [
  ['empuje-recto · perfil', 'empuje-recto', 90, {}, cam([0.1, 0.95, 0]), { sonrisa: 0.1 }],
  ['gyaku-zuki-kiai (comparar)', 'gyaku-zuki-kiai', 90, {}, cam([0.1, 0.95, 0]), { sonrisa: 0.1 }],
  ['encoge-hombros · frente', 'encoge-hombros', 0, {}, cam([0, 0.95, 0]), { cejas: 0.5, sonrisa: 0.15, torcida: 0.4 }],
  ['seiza · frente (gi + naranja)', 'seiza', 0, SZ('seiza'), cam([0, 0.55, 0], 6, 3), { sonrisa: 0.8, cejas: 0.3 }],
  ['seiza · 3/4', 'seiza', 40, SZ('seiza'), cam([0, 0.55, 0], 6, 6), { sonrisa: 0.8, cejas: 0.3 }],
  ['seiza-alto · 3/4', 'seiza-alto', 40, SZ('seiza-alto'), cam([0, 0.6, 0], 6, 4), { cejas: -0.4, ojos: 0.6, sonrisa: 0.1 }],
  ['en-cuclillas-medio · perfil', 'en-cuclillas-medio', 90, {}, cam([0, 0.6, 0], 5.5, 3), { cejas: -0.6, ojos: 0.7, torcida: 0.4 }],
  ['manos-rodillas · perfil', 'manos-rodillas', 90, {}, cam([0, 0.8, 0], 6, 3), { cejas: -0.5, ojos: 0.5, sonrisa: 0.1 }],
  ['levantarse-vacilando · frente', 'levantarse-vacilando', 10, {}, cam([0, 0.85, 0], 6.5, 3), { cejas: -1, ojos: 1, torcida: 0.6 }],
  ['levantarse-vacilando · 3/4', 'levantarse-vacilando', 50, {}, cam([0, 0.85, 0], 6.5, 4), { cejas: -1, ojos: 1, torcida: 0.6 }],
];
window.DURACION = VISTAS.length;
window.render = (t) => {
  const [rot, pose, rumbo, op, c, cara] = VISTAS[Math.min(VISTAS.length - 1, Math.floor(t))];
  k.colocar(0, 0, rumbo);
  if (pose === 'mezcla') { const f = (t % 1) < 0.5 ? 0 : 1; k.aplicarPose(mezclar(P['gyaku-zuki-kiai'], P['empuje-recto'], 1), op); }
  else k.aplicarPose(P[pose], op);
  k.cara(cara);
  esc.orbita(c);
  esc.dibujar(ctx, { grano: false });
  EMAKI.texto(ctx, { lineas: rot, size: 60, y: 120 });
};
</script></body></html>
