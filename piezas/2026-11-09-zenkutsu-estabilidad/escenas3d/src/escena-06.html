<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Escena 3D</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import { crearEscenario, util as U } from '../../../../animacion/3d/escenario.js';
import { Karateka3D, cargarPoses, mezclar } from '../../../../animacion/3d/karateka3d.js';
import { Diagrama3D } from '../../../../animacion/3d/diagrama3d.js';
import { overlay } from '../../../../animacion/3d/overlay2d.js';
const ctx = document.getElementById('c').getContext('2d');
const esc = crearEscenario({ escala: 0.5 });
const k = new Karateka3D({ cinturon: 'negro' });
esc.escena.add(k.raiz);
const P = cargarPoses();
const d = new Diagrama3D(esc, k);
window.DURACION = 4;
// Escena 6: la cadera baja con los pies clavados (pose bajada «a medida»: espinilla delantera algo inclinada) y empuje hasta ≈30°
const A = P['zenkutsu-dachi'];
const B = JSON.parse(JSON.stringify(P['zenkutsu-bajo']));   // zenkutsu-bajo con pierna trasera menos estirada: base idéntica a A (pies fijos)
B.piernaI.adelante = 62.57; B.rodillaI = 86.74; B.piernaD.adelante = -45.44; B.rodillaD = 0.05; B.tobilloD.flex = 36.05; B.tobilloI.flex = 20.41;
k.colocar(-0.05, 0, 90);
k.aplicarPose(A); const ancla = { pie: 'I', x: k.punto('tobilloI').x, z: k.punto('tobilloI').z };
const poseF = (f) => mezclar(A, B, f);
window.DEBUG = false; window.render = (t) => {
  const f = U.easeInOut(U.prog(t, 0.3, 1.5));
  k.aplicarPose(poseF(f), { ancla });
  d.ajustarVuelco(26 + 4 * f);
  if (window.DEBUG) { const g = (n) => k.punto(n); console.warn(t.toFixed(2), 'tI', g('tobilloI').x.toFixed(3), g('tobilloI').z.toFixed(3), 'tD', g('tobilloD').x.toFixed(3), g('tobilloD').y.toFixed(3), 'talD', g('talonD').x.toFixed(3), g('talonD').y.toFixed(3), 'pI', g('puntaI').x.toFixed(3), g('puntaI').y.toFixed(3), 'base', k.medidas().base.toFixed(3), 'cad', k.medidas().alturaCadera.toFixed(3)); }
  const sube = U.easeInOut(U.prog(t, 1.9, 3.0)), baja = U.easeInOut(U.prog(t, 3.5, 3.95));
  const hold = U.prog(t, 3.0, 3.2) * (1 - U.prog(t, 3.4, 3.5));
  const esf = Math.min(1, sube * 1.2) * (1 - baja);
  const inc = 30 * sube * (1 - baja) - hold * (0.7 * Math.sin(t * 38) + 0.4 * Math.sin(t * 23 + 1)) * 0.9;
  k.inclinar(inc);
  const ceja = -0.8 * esf + 0.9 * U.prog(t, 3.7, 3.95) + 0.25 * U.prog(t, 0.5, 1.2) * (1 - U.prog(t, 1.8, 2.1));
  k.cara({ parpadeo: U.parpadeo(t, [0.2, 3.65]), cejas: ceja, sonrisa: 0.1 * (1 - esf) });
  esc.orbita({ centro: [0.2, 0.9, 0], distancia: 7.7, azimut: 0, elevacion: 3, fov: 26 });
  d.limpiar();
  d.base({ alerta: 0.65 * U.prog(inc, 25, 30) * (1 - baja) });
  const c = d.cdm();
  const piv = d.pivote();
  d.arco({ centro: piv, desde: 0, angulo: 26, radio: 0.62, texto: '26°', relleno: 0.05, color: '#8A847A', distTexto: 1.0, desplazaTexto: [95, -45], tamTexto: 56 });
  const fm = 1 - U.prog(t, 1.9, 2.2);
  if (fm > 0.01) d.arco({ centro: piv, desde: 0, hasta: c, radio: 0.42, texto: '', alfa: fm * U.prog(t, 1.2, 1.6) });
  if (inc > 0.8 && t < 3.8) d.arco({ centro: piv, desde: 0, angulo: inc, radio: 0.42, texto: (hold > 0.5 && t < 3.5) ? '30°' : '', distTexto: 1.0, desplazaTexto: [150, 15], tamTexto: 80 });
  // flechita roja hacia abajo junto al punto mientras baja
  const al = U.prog(t, 0.35, 0.7) * (1 - U.prog(t, 1.5, 1.9));
  if (al > 0.01) d.flecha({ desde: [c.x - 0.38, 0.99, 0], hacia: [c.x - 0.38, 0.6 + 0.0, 0], crecer: U.easeOut(U.prog(t, 0.35, 1.3)), alfa: al, grosor: 0.02 });
  const cx = k.punto('cadera').x;
  if (t > 1.75 && t < 3.6) d.flecha({ desde: [cx - 1.15, 1.15, 0], hacia: [cx - 0.5, 1.15, 0], crecer: U.easeOut(U.prog(t, 1.75, 2.1)), alfa: 1 - U.prog(t, 3.3, 3.6) });
  esc.dibujar(ctx);
  d.dibujar2D(ctx);
  overlay.titulo(ctx, t, { lineas: 'Cadera baja: [r]≈30°[/r]', t0: -1, size: 96 });
  overlay.letraPequena(ctx, 'Modelo simplificado: cuerpo rígido');
};
</script></body></html>
