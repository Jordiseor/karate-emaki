<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Escena 3D</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import { crearEscenario, util as U } from '../../../../animacion/3d/escenario.js';
import { Karateka3D, cargarPoses, mezclar } from '../../../../animacion/3d/karateka3d.js';
import { Diagrama3D } from '../../../../animacion/3d/diagrama3d.js';
import { overlay } from '../../../../animacion/3d/overlay2d.js';
const ctx = document.getElementById('c').getContext('2d');
const esc = crearEscenario({ escala: 0.5 });
const k = new Karateka3D({ cinturon: 'negro' });
esc.escena.add(k.raiz);
const P = cargarPoses();
const d = new Diagrama3D(esc, k);
window.DURACION = 4;
// Escena 7: vuelve a zenkutsu alto; la cámara gira 90° (perfil → frontal); base estrecha; empuje lateral con pequeño tambaleo
const A = P['zenkutsu-dachi'];
const B = JSON.parse(JSON.stringify(P['zenkutsu-bajo']));   // misma pose baja a medida que en la escena 6 (pies clavados)
B.piernaI.adelante = 62.57; B.rodillaI = 86.74; B.piernaD.adelante = -45.44; B.rodillaD = 0.05; B.tobilloD.flex = 36.05; B.tobilloI.flex = 20.41;
k.colocar(0, 0, 90);
k.aplicarPose(A); const ancla = { pie: 'I', x: k.punto('tobilloI').x, z: k.punto('tobilloI').z };
window.render = (t) => {
  const f = 1 - U.easeInOut(U.prog(t, 0.0, 0.7));          // 1 = baja (final de la escena 6) → 0 = zenkutsu alto
  k.aplicarPose(mezclar(A, B, f), { ancla });
  d.ajustarVuelco(26 + 4 * f);
  // empuje lateral: sube a 8° hacia su izquierda (derecha de pantalla) y se amortigua
  const s = t - 3.0, riseT = U.easeInOut(U.prog(t, 2.55, 3.0));
  const bal = t < 3.0 ? 8 * riseT : 8 * Math.exp(-3.2 * s) * Math.cos(2 * Math.PI * 1.4 * s);
  k.inclinar(bal, { lado: 90 });
  const sorpresa = U.prog(t, 2.55, 2.8) * (1 - U.prog(t, 3.5, 3.9));
  k.cara({ parpadeo: U.parpadeo(t, [0.3, 3.7]), cejas: 0.8 * sorpresa, sonrisa: 0.15 + 0.5 * sorpresa });
  // giro de cámara 90° (≈1,5 s, suave)
  const g = U.easeInOut(U.prog(t, 0.6, 2.1));
  esc.orbita({ centro: [U.lerp(0.12, 0, g), U.lerp(0.9, 1.0, g), 0], distancia: U.lerp(7.4, 8.6, g), azimut: 90 * g, elevacion: 3, fov: 26 });
  d.limpiar();
  d.base({ eje: 'frente', alfa: 1 - U.prog(t, 1.3, 1.9) });
  d.base({ eje: 'lado', alfa: U.prog(t, 1.7, 2.3), alerta: 0.45 * U.prog(bal, 2, 8) });
  d.cdm();
  if (t > 2.4 && t < 3.6) d.flecha({ desde: [0, 1.15, -1.2 * 0 + 1.25], hacia: [0, 1.15, 0.5], crecer: U.easeOut(U.prog(t, 2.4, 2.75)), alfa: 1 - U.prog(t, 3.2, 3.6) });
  esc.dibujar(ctx);
  d.dibujar2D(ctx);
  overlay.titulo(ctx, t, { lineas: 'De lado, la base es estrecha', t0: 1.4, size: 84 });
  overlay.letraPequena(ctx, 'Modelo simplificado: cuerpo rígido');
};
</script></body></html>
