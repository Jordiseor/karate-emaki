<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Escena 3D</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import { crearEscenario, util as U } from "../../../../animacion/3d/escenario.js";
import { Karateka3D, cargarPoses, mezclar } from "../../../../animacion/3d/karateka3d.js";
import { Diagrama3D } from "../../../../animacion/3d/diagrama3d.js";
import { overlay } from "../../../../animacion/3d/overlay2d.js";
const ctx = document.getElementById("c").getContext("2d");
const esc = crearEscenario({ escala: 0.5 });
const k = new Karateka3D({ cinturon: "negro" });
esc.escena.add(k.raiz);
const P = cargarPoses();
const d = new Diagrama3D(esc, k);

window.DURACION = 4;
k.colocar(0, 0, 90).aplicarPose(P['pies-juntos']);
d.ajustarVuelco(8);
const __r = (t) => {
  k.aplicarPose(P['pies-juntos']);
  k.cara({ parpadeo: U.parpadeo(t, [2.6]), sonrisa: 0.3, mirada: [0.3, 0] });
  const z = U.easeInOut(U.prog(t, 0, 1.2));
  esc.orbita({ centro: [0.1, U.lerp(0.95, 0.62, z), 0], distancia: U.lerp(7.2, 6.0, z) - 0.15 * U.prog(t, 1.2, 4), azimut: 0, elevacion: 3, fov: 26 });
  d.limpiar();
  const a = U.prog(t, 0.8, 1.2);
  const c = d.cdm({ alfa: a });
  d.base({ alfa: U.prog(t, 1.9, 2.3), crecer: U.easeOut(U.prog(t, 1.9, 2.5)) });
  if (t > 1.3) d.etiqueta(c, 'Centro de masas', { tam: 56, color: '#1A1A1A', alfa: U.prog(t, 1.3, 1.7), desplaza: [-250, -150] });
  esc.dibujar(ctx); d.dibujar2D(ctx);
  if (t > 1.3) { // flechita de la etiqueta al punto
    const p = esc.proyectar(c), al = U.prog(t, 1.3, 1.7), x1 = p.x - 250 + 215, y1 = p.y - 150 + 5;
    ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = '#C8102E'; ctx.fillStyle = '#C8102E'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    const dx = p.x - 40 - x1, dy = p.y - 30 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(p.x - 40, p.y - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x - 34, p.y - 25); ctx.lineTo(p.x - 34 - 30 * ux - 15 * uy, p.y - 25 - 30 * uy + 15 * ux); ctx.lineTo(p.x - 34 - 30 * ux + 15 * uy, p.y - 25 - 30 * uy - 15 * ux); ctx.fill();
    ctx.restore();
  }
};
window.DURACION = 3; const __T0 = 0.3; window.render = (t_) => __r(t_ + __T0);
</script></body></html>
