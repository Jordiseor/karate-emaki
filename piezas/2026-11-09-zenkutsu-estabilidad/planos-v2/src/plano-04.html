<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Escena 3D</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import { crearEscenario, util as U } from "../../../../animacion/3d/escenario.js";
import { Karateka3D, cargarPoses, mezclar } from "../../../../animacion/3d/karateka3d.js";
import { Diagrama3D } from "../../../../animacion/3d/diagrama3d.js";
import { overlay } from "../../../../animacion/3d/overlay2d.js";
const ctx = document.getElementById("c").getContext("2d");
const esc = crearEscenario({ escala: 0.5 });
const k = new Karateka3D({ cinturon: "negro" });
esc.escena.add(k.raiz);
const P = cargarPoses();
const d = new Diagrama3D(esc, k);
window.DURACION = 4;
k.colocar(0, 0, 90).aplicarPose(P['pies-juntos']);
const tobD = k.punto('tobilloD'), anc = { x: tobD.x, z: tobD.z };
const __r = (t) => {
  const s = U.easeInOut(U.prog(t, 0.35, 1.0));
  const ini = mezclar(P['pies-juntos'], P['zenkutsu-dachi'], { piernas: s, brazos: U.easeInOut(U.prog(t, 0.45, 1.1)), tronco: s, cabeza: s });
  k.aplicarPose(ini, { ancla: { pie: 'D', x: anc.x, z: anc.z } });
  // salto ágil: pequeño rebote al aterrizar
  k.cara({ parpadeo: U.parpadeo(t, [1.7, 3.3]), sonrisa: 0.45 + 0.25 * U.prog(t, 1.0, 1.4), cejas: -0.3 * U.prog(t, 1.0, 1.4) });
  const q = U.easeOut(U.prog(t, 0, 4));
  esc.orbita({ centro: [0.1, 0.95, 0], distancia: 7.9 - 0.7 * q, azimut: 0, elevacion: 3, fov: 26 });
  d.limpiar();
  if (t >= 1.0) d.ajustarVuelco(26); else d.ajustarVuelco(null);
  const b = d.base({ alfa: 1 });
  if (t > 1.2) {
    const m = [0, 1, 2, 3, 4];
    m.forEach((i) => {
      const a = U.prog(t, 1.3 + i * 0.18, 1.5 + i * 0.18);
      if (a <= 0) return;
      const x = U.lerp(b.desde.x, b.hasta.x, i / 4), z = U.lerp(b.desde.z, b.hasta.z, i / 4);
      d.linea([x, 0.01, z], [x, 0.2 + 0.08 * a, z], { grosor: 0.012, alfa: a, color: '#1A1A1A' });
    });
    for (let i = 0; i < 4; i++) {
      const a = U.prog(t, 1.4 + i * 0.18, 1.7 + i * 0.18);
      const x = U.lerp(b.desde.x, b.hasta.x, (i + 0.5) / 4), z = U.lerp(b.desde.z, b.hasta.z, (i + 0.5) / 4);
      d.etiqueta([x, 0.0, z], '1 pie', { tam: 48, color: '#1A1A1A', alfa: a * 0.0 });
    }
  }
  d.cdm({ alfa: U.prog(t, 2.2, 2.6) });
  esc.dibujar(ctx); d.dibujar2D(ctx);
  overlay.titulo(ctx, t, { lineas: 'Posición adelantada', t0: 0.4, size: 84 });
};
window.DURACION = 2.5; const __T0 = 0.3; window.render = (t_) => __r(t_ + __T0);
</script></body></html>
