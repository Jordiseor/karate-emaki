<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../../animacion/marca.js"></script>
<script type="module">
import { crearEscenario, util as U } from "../../../../animacion/3d/escenario.js";
import * as HS from "../../../../animacion/3d/historia3d.js";
import * as H2 from "../../../../animacion/3d/historia2d.js";
import { Karateka3D, cargarPoses, mezclar } from "../../../../animacion/3d/karateka3d.js";
import { overlay } from "../../../../animacion/3d/overlay2d.js";
const { ambiente, crearCasa, crearMaestro, anadirMaestro, crearPapelColgado, crearCartel, crearFila } = HS;
const ctx = document.getElementById("c").getContext("2d");
const esc = crearEscenario({ escala: 0.5, fondo: "degradado" });
const P = cargarPoses();
esc.escena.fog.near = 14; esc.escena.fog.far = 70;
const m = anadirMaestro(esc, crearMaestro({}));
const papel = crearPapelColgado({ texto: "空手" }); esc.escena.add(papel.raiz);
const pos = [[-1.3, 0.2, "flecha"], [1.2, 0.5, "madera"], [-1.5, -1.2, "papel"], [1.6, -1.3, "flecha"], [-0.2, -2.4, "madera"]];
const carteles = pos.map(([x, z, tipo], i) => { const c = crearCartel({ texto: "SHOTOKAN", tipo, semilla: i }); c.colocar(x, z); esc.escena.add(c.raiz); return c; });
window.DURACION = 4.5;
window.render = (t) => {
  m.colocar(0, 0.3, 180).pose(P, "maestro-pie-escribiendo", { escribir: t });
  papel.colocar(0, -0.32, 0).escribir(U.prog(t, 0.2, 3.4));
  carteles.forEach((c, i) => { c.pop(U.prog(t, 1.0 + 0.6 * i, 1.7 + 0.6 * i)); if (i !== 1 && i !== 4) c.apuntar(0, 0.3); });
  esc.orbita({ centro: [0, 1.15, -0.3], distancia: 11.5, azimut: 28, elevacion: 8, fov: 30 });
  esc.dibujar(ctx);
  overlay.titulo(ctx, t, { lineas: ["Él nunca bautizó", "su estilo"], size: 88, t0: 0.3 });
};
</script></body></html>
