<!--#cabecera-->
<title>Escena 7 · 1945, ardió</title>
<script>
// 20–23 s (3 s). Cielo oscuro. Tinta roja crece desde los bordes y se come la casa; al retirarse quedan trazos grises de ceniza.
// Tono sobrio: sin aviones, sin personas, sin explosiones.
window.DURACION = 3;
const E = EMAKI, U = E.util, S = E.sumie, C = E.marca.color, ctx = E.lienzo(), CASA = PIEZA.casa;
const cx = 540, by = 1440, an = 640;
const off = document.createElement('canvas'); off.width = 1080; off.height = 1920; const ox = off.getContext('2d');
// campo de "mancha": distancia al borde + ruido → umbral animado
function mancha(nivel, alpha) {
  const W = 270, H = 480, im = ox.createImageData(W, H), d = im.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const bx = Math.min(x, W - 1 - x) / (W / 2), byy = Math.min(y, H - 1 - y) / (H / 2);
    const base = Math.min(bx, byy * 0.8 + 0.2 * (1 - y / H)) + 0.45 * (U.fbm(x / 22, y / 22) - 0.5);
    const v = U.clamp((nivel - base) / 0.06);
    const i = (y * W + x) * 4; d[i] = 200; d[i + 1] = 16; d[i + 2] = 46; d[i + 3] = 255 * v * alpha;
  }
  ox.clearRect(0, 0, 1080, 1920); ox.putImageData(im, 0, 0);
  ctx.save(); ctx.imageSmoothingEnabled = true; ctx.drawImage(off, 0, 0, W, H, 0, 0, 1080, 1920); ctx.restore();
}
window.render = function (t) {
  // cielo: papel → oscuro
  E.fondoPapel(ctx);
  const osc = U.easeInOut(U.prog(t, 0, 0.6));
  ctx.save(); ctx.globalAlpha = osc * 0.92; ctx.fillStyle = C.noche; ctx.fillRect(0, 0, 1080, 1920); ctx.restore();
  // casa (silueta clara sobre el cielo) que se desvanece mientras la tinta roja la cubre
  const casaA = 1 - U.prog(t, 1.05, 1.25);
  if (casaA > 0) S.casa(ctx, cx, by, an, { pincel: true, ancho: 11, color: '#E9E1D2', alpha: casaA, seco: 0.1, papel: C.noche });
  // ceniza: trazos grises rotos donde estaba la casa
  const cen = U.prog(t, 1.5, 2.3);
  if (cen > 0) S.casaUnidad.forEach((pl, i) => {
    const pts = pl.map((p) => [cx + p[0] * an, by + p[1] * an + (i > 4 ? 40 + i * 6 : 0)]);
    const r = U.rng(i + 50); if (r() < 0.15) return;
    const caido = pts.map((p) => [p[0] + (r() - 0.5) * 20, Math.max(p[1], by - 160 + r() * 140)]);
    S.pincel(ctx, caido, { ancho: 10, color: '#9A938A', alpha: cen, semilla: 700 + i, seco: 0.7, papel: C.noche, prog: 0.4 + r() * 0.5 });
  });
  // tinta roja (fuego): crece hasta cubrir el centro y luego se retira
  const nivel = U.lerp(-0.15, 1.25, U.easeInOut(U.prog(t, 0.3, 1.3))) - U.easeInOut(U.prog(t, 1.45, 2.4)) * 1.35;
  mancha(nivel, 0.95);
  // banda oscura detrás del texto (que «1945» se lea sobre el rojo)
  ctx.save(); ctx.globalAlpha = 0.85 * U.prog(t, 0.2, 0.5); ctx.fillStyle = C.noche; ctx.fillRect(0, 262, 1080, 300); ctx.restore();
  // texto: claro sobre el cielo, año en rojo
  E.tarjeta(ctx, t, { t0: 0.2, lineas: ['[r]1945[/r]', 'ardió en los bombardeos'], size: [150, 84], y: PIEZA.textoY, color: C.papel, rojo: '#E8344F', sombra: 'rgba(0,0,0,0.5)' });
};
</script>
