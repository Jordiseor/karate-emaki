<!--#cabecera-->
<title>Escena 3 · Viento que suena a mar</title>
<script>
// 8–11 s (3 s). Los pinos se mecen; del viento salen curvas que se vuelven olas y vuelven a ser viento entre pinos.
window.DURACION = 3;
const E = EMAKI, U = E.util, S = E.sumie, C = E.marca.color, ctx = E.lienzo();
function remuestrear(pts, N) { const out = []; for (let i = 0; i < N; i++) { const q = S.recortar(pts, i / (N - 1)); out.push(q[q.length - 1]); } return out; }
const FILAS = [ { y: 820, x: 150, w: 360, h: 120 }, { y: 830, x: 560, w: 380, h: 140 },
  { y: 1010, x: 80, w: 420, h: 150 }, { y: 1020, x: 520, w: 440, h: 170 }, { y: 1200, x: 260, w: 460, h: 160 } ];
const N = 40;
const viento = FILAS.map((f, i) => remuestrear(S.suavizar([[f.x, f.y], [f.x + f.w * 0.3, f.y - 40], [f.x + f.w * 0.65, f.y + 20], [f.x + f.w, f.y - 30 - (i % 2) * 20]], 3), N));
const ola = FILAS.map((f) => remuestrear(S.suavizar(S.puntosOla(f.x, f.y + f.h * 0.4, f.w, f.h), 3), N));
window.render = function (t) {
  E.fondoPapel(ctx);
  const bal = 1 + 1.6 * Math.sin(Math.PI * U.prog(t, 0, 3)); // el viento arrecia a mitad
  S.pino(ctx, 120, 1520, 900, { t: t * 2.2 + 5, semilla: 11, inclina: 1, balanceo: bal, alpha: 0.9 });
  S.pino(ctx, 990, 1460, 720, { t: t * 2.2 + 7, semilla: 23, inclina: -1, balanceo: bal, alpha: 0.5, ramas: 4 });
  // morfismo viento → ola → viento (0.6–1.3 s a ola, 2.1–2.8 s vuelta)
  const m = U.easeInOut(U.prog(t, 0.6, 1.3)) * (1 - U.easeInOut(U.prog(t, 2.1, 2.8)));
  const flujo = t * 60;
  FILAS.forEach((f, i) => {
    const aparece = U.easeOut(U.prog(t, 0.05 + i * 0.08, 0.6 + i * 0.08));
    const pts = viento[i].map((p, k) => { const q = ola[i][k]; const dx = Math.sin(t * 3 + k * 0.3 + i) * 6 * (1 - m);
      return [U.lerp(p[0] + dx + flujo * (1 - m) * 0.3, q[0] + Math.sin(t * 2 + i) * 8, m), U.lerp(p[1] + Math.sin(t * 4 + k * 0.4 + i) * 8 * (1 - m), q[1], m)]; });
    S.pincel(ctx, pts, { ancho: U.lerp(9, 22, m), semilla: 400 + i, prog: aparece * (1 - U.prog(t, 2.75, 3.0) * 0), alpha: 0.85, cola: 0.4, seco: 0.4 });
    // espuma: pequeñas gotas solo cuando es ola
    if (m > 0.6) for (let k = 0; k < 4; k++) { const q = ola[i][N - 1 - k * 3]; ctx.save(); ctx.globalAlpha = (m - 0.6) * 2; ctx.fillStyle = C.tinta;
      ctx.beginPath(); ctx.arc(q[0] + 14 + k * 9, q[1] - 22 - k * 6 + Math.sin(t * 6 + k) * 4, 5 - k, 0, 7); ctx.fill(); ctx.restore(); }
  });
  E.tarjeta(ctx, t, { t0: 0.1, lineas: ['Viento entre pinos', 'que suena a mar'], size: 96, y: PIEZA.textoY });
};
</script>
