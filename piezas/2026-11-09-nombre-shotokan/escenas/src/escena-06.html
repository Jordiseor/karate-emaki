<!--#cabecera-->
<title>Escena 6 · Cuentan que… la casa de Shōtō</title>
<script>
// 17–20 s (3 s). Dos alumnos (siluetas) cuelgan el rótulo; el pincel escribe 松濤館 en él.
// Marco de pergamino con «Cuentan que…» visible TODO el tiempo (es tradición, no dato seguro).
window.DURACION = 3;
const E = EMAKI, U = E.util, S = E.sumie, K = E.karateka, C = E.marca.color, ctx = E.lienzo();
// marco de pergamino (rollo emaki): varillas arriba y abajo, bordes de papel más oscuro
function pergamino(x0, y0, x1, y1) {
  ctx.save(); ctx.strokeStyle = C.tinta; ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(201,180,142,0.22)'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.lineWidth = 5; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  ctx.lineWidth = 2; ctx.strokeRect(x0 + 16, y0 + 16, x1 - x0 - 32, y1 - y0 - 32);
  for (const y of [y0, y1]) { ctx.fillStyle = C.tinta; ctx.beginPath(); ctx.roundRect(x0 - 34, y - 13, x1 - x0 + 68, 26, 13); ctx.fill(); }
  ctx.restore();
}
window.render = function (t) {
  E.fondoPapel(ctx);
  pergamino(80, 560, 1000, 1600);
  // fachada de la casa en primer plano: muro, alero, puerta
  ctx.save(); ctx.fillStyle = '#E9E1D2'; ctx.fillRect(170, 800, 740, 720); ctx.restore();
  S.pincel(ctx, [[120, 790], [540, 780], [960, 790]], { ancho: 34, semilla: 21, cola: 0.08, entrada: 0.05, seco: 0.3 });
  for (const x of [190, 890]) S.pincel(ctx, [[x, 800], [x, 1520]], { ancho: 14, semilla: x, cola: 0.05, entrada: 0.02 });
  S.pincel(ctx, [[400, 1520], [400, 1180], [680, 1180], [680, 1520]], { ancho: 10, semilla: 22, cola: 0.05, entrada: 0.02, seco: 0.1 });
  // rótulo: sube desde abajo hasta su sitio (0–1.1 s)
  const sube = U.easeOut(U.prog(t, 0, 1.1)), ry = U.lerp(1090, 960, sube), rw = 440, rh = 150;
  ctx.save(); ctx.fillStyle = '#C9B48E'; ctx.strokeStyle = C.tinta; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.rect(540 - rw / 2, ry - rh / 2, rw, rh); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 3; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(540 + s * rw * 0.35, ry - rh / 2); ctx.lineTo(540 + s * rw * 0.2, 800); ctx.stroke(); }
  ctx.restore();
  // pincel escribe 松濤館 en el rótulo (1.0–2.4 s)
  S.kanji(ctx, '松濤館', 540, ry + 4, 118, { prog: U.prog(t, 1.0, 2.4), color: C.rojo, separacion: 128 });
  // dos alumnos (siluetas) con los brazos arriba sujetando el rótulo, a los lados
  const alto = U.lerp(0.95, 0.7, U.prog(t, 1.2, 1.8));
  const pose = K.mezclar(K.poses.yoi, K.poses['brazos-arriba'], alto);
  K.dibujar(ctx, pose, { x: 250, suelo: 1520, escala: 0.6, estilo: 'silueta', dir: 1 });
  K.dibujar(ctx, pose, { x: 830, suelo: 1520, escala: 0.6, estilo: 'silueta', dir: -1 });
  S.pincel(ctx, [[150, 1522], [540, 1518], [930, 1522]], { ancho: 9, semilla: 4, alpha: 0.7 });
  // «Cuentan que…» fijo en el marco, todo el tiempo (sin animación de entrada)
  E.texto(ctx, { lineas: ['Cuentan que…'], size: 92, peso: 800, y: 600 });
  E.texto(ctx, { lineas: ['leyenda'], size: 48, peso: 600, y: 715, color: '#5A544B' });
  // título superior
  E.tarjeta(ctx, t, { t0: 1.2, lineas: ['[r]松濤館[/r]', 'la casa de Shōtō'], size: [110, 92], y: PIEZA.textoY - 20 });
};
</script>
