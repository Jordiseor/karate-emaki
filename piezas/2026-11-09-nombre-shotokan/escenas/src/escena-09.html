<!--#cabecera-->
<title>Escena 9 · Tu estilo es un edificio</title>
<script>
// 27–30 s (3 s). Karateka de la escena 1 delante; detrás, muchos karatekas iguales en fila.
// Al fondo, el contorno fantasma (discontinuo) de la casa, con 松濤館 en rojo encima. Últimos 0,5 s congelados (--congelar 0.5).
window.DURACION = 3;
const E = EMAKI, U = E.util, S = E.sumie, K = E.karateka, C = E.marca.color, ctx = E.lienzo(), CASA = PIEZA.casa;
window.render = function (t) {
  E.fondoPapel(ctx);
  // casa fantasma (discontinua) que se dibuja
  S.casa(ctx, CASA.x, 1330, CASA.ancho, { prog: U.easeInOut(U.prog(t, 0, 1.0)), ancho: 6, dash: [22, 16], alpha: 0.55 });
  S.kanji(ctx, '松濤館', 540, 640, 170, { prog: U.prog(t, 0.4, 1.4), color: C.rojo, halo: true, separacion: 178 });
  // filas de karatekas detrás (opacos, sin solaparse; un velo de papel entre filas da profundidad)
  const filas = [ { n: 6, suelo: 1330, esc: 0.27, paso: 150, velo: 0.55 }, { n: 4, suelo: 1420, esc: 0.36, paso: 225, velo: 0.35 } ];
  filas.forEach((f, fi) => {
    for (let i = 0; i < f.n; i++) {
      const x = 540 + (i - (f.n - 1) / 2) * f.paso - 20, ap = U.easeOut(U.prog(t, 0.3 + fi * 0.2 + i * 0.06, 0.7 + fi * 0.2 + i * 0.06));
      if (ap > 0) K.dibujar(ctx, K.poses.kamae, { x, suelo: f.suelo + (1 - ap) * 30, escala: f.esc, alpha: ap });
    }
    ctx.save(); ctx.globalAlpha = f.velo; ctx.fillStyle = C.papel; ctx.fillRect(0, 980, 1080, f.suelo - 975); ctx.restore();
  });
  // karateka principal de la escena 1
  S.pincel(ctx, [[110, 1520], [540, 1516], [970, 1522]], { ancho: 7, semilla: 3, alpha: 0.5 });
  K.dibujar(ctx, Object.assign({}, K.poses.kamae, { torso: K.poses.kamae.torso + Math.sin(Math.min(t, 2.5) * 2.4) * 0.7 }), { x: 520, suelo: 1520, escala: 0.62 });
  E.tarjeta(ctx, t, { t0: 0.1, lineas: ['¿Sabías que tu estilo', 'es un edificio?'], size: 96, y: PIEZA.textoY });
};
</script>
