<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Cadera · plano 11</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const S = C.iniciar(); const { ctx, esc, P, k, d, U } = S;
window.DURACION = 2.5;
// PLANO 11 (2,5) 3/4 (azimut 35: los eslabones no se alinean en una «T»), pose final;
// cadena roja fina con nodo en cada eslabón: cadera -> pecho -> hombroD -> codoD -> manoD, crece en 1,5 s y acaba en punta más allá del puño.
const GR = 0.018;   // 60 % del grosor de las flechas del plano 1
window.render = (t) => {
  k.colocar(0, 0, 90); k.aplicarPose(P['gyaku-zuki-kiai']); k.cara({ parpadeo: U.parpadeo(t, [1.2]) });
  d.limpiar();
  const z = 0.22, pts = ['cadera', 'pecho', 'hombroD', 'codoD', 'manoD'].map(n => { const p = k.punto(n).clone(); p.z += z; return p; });
  const dir = pts[4].clone().sub(pts[3]).normalize(); pts.push(pts[4].clone().addScaledVector(dir, 0.38));
  const len = []; let L = 0; for (let i = 0; i < 5; i++) { len.push(pts[i + 1].distanceTo(pts[i])); L += len[i]; }
  let rec = L * U.easeInOut(U.prog(t, 0.25, 1.75)), acc = 0;
  for (let i = 0; i < 5; i++) {
    const f = Math.max(0, Math.min(1, (rec - acc) / len[i])); acc += len[i]; if (f <= 0) continue;
    if (i < 4) d.linea(pts[i], pts[i].clone().lerp(pts[i + 1], f), { color: C.ROJO, grosor: GR });
    else d.flecha({ desde: pts[4], hacia: pts[5], crecer: f, grosor: GR * 1.2, punta: 0.15 });
    if (f >= 1 && i < 4) d.cdm({ punto: pts[i + 1], radio: 0.03, vertical: false, color: C.ROJO });   // nodo al llegar al eslabón
  }
  if (rec > 0) d.cdm({ punto: pts[0], radio: 0.034, vertical: false, color: C.ROJO });                 // nodo de salida: la cadera
  C.camPerfil(esc, { azimut: 35, centro: [0.1, 1.0, 0], distancia: 7.0 }); esc.sombraEn(0, 0);
  esc.dibujar(ctx); d.dibujar2D && d.dibujar2D(ctx);
  C.tarjeta(ctx, t, ['La cadera abre', 'la cadena'], { t0: 0.1, y: 300 });
};
</script></body></html>
