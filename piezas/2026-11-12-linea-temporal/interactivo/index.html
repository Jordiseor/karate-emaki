<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De Okinawa a Tokio en 36 años · KARATE EMAKI</title>
<meta name="description" content="Línea temporal interactiva del karate de Funakoshi, 1921–1957, con el nivel de certeza de cada hito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#F4EFE6;--t:#1A1A1A;--r:#C8102E;--t2:#1A1A1A99}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow-x:hidden;background:var(--p);color:var(--t)}
body{font:400 18px/1.45 "Noto Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.big{font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;line-height:1.08}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.view{display:none;height:100dvh;flex-direction:column;overflow:hidden}
.view.on{display:flex}
.red{color:var(--r)}
.btn{min-height:52px;padding:0 28px;border:3px solid var(--t);background:var(--t);color:var(--p);font-family:"Archivo Black",Arial,sans-serif;font-size:19px;border-radius:6px}
.btn.alt{background:transparent;color:var(--t)}
svg{display:block}
.fg{fill:var(--t)}.rd{fill:var(--r)}.ln{fill:none;stroke:var(--t);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.lr{fill:none;stroke:var(--r);stroke-width:3;stroke-linecap:round}.pp{fill:var(--p)}
/* portada */
#v1{padding:24px 22px;justify-content:space-between;max-width:560px;margin:0 auto;width:100%}
#v1 h1{font-size:clamp(30px,9vw,44px)}
#v1 h1 .n{font-size:1.9em;display:block;color:var(--r);line-height:1}
#v1 p.sub{margin-top:10px}
.roll{width:100%;max-height:46dvh;transform-origin:left center;animation:unroll 1s ease-out both}
@keyframes unroll{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.aviso{font-size:14px;color:var(--t2);margin-top:12px}
/* línea */
#v2 header{padding:10px 12px 0;flex:none;max-width:900px;width:100%;margin:0 auto}
.rule{position:relative;height:54px;margin:0 8px}
.rule:before{content:"";position:absolute;left:0;right:0;top:26px;height:3px;background:var(--t)}
.mk{position:absolute;top:0;width:44px;height:54px;margin-left:-22px;background:none;border:0;padding:0}
.mk i{position:absolute;left:50%;top:19px;width:14px;height:14px;margin:0 0 0 -7px;border-radius:50%;background:var(--p);border:3px solid var(--t)}
.mk.on i{background:var(--r);border-color:var(--r);transform:scale(1.35)}
.mk b{position:absolute;left:0;right:0;top:36px;font:700 11px/1 "Noto Sans",sans-serif;text-align:center;color:var(--t);display:none}
.mk.on b{display:block;color:var(--r)}
.mk.l b{display:block}
.mk.l.on b{color:var(--r)}
.scroller{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;min-height:0}
.scroller::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;padding:6px 20px 12px;display:flex;flex-direction:column;gap:8px}
.card>*{max-width:560px;width:100%;margin-left:auto;margin-right:auto}
.yr{font-family:"Archivo Black",Arial,sans-serif;font-size:clamp(46px,15vw,72px);line-height:1;color:var(--r)}
.card h2{font-size:clamp(22px,6.4vw,30px)}
.card svg.sil{width:100%;height:auto;max-height:26dvh;background:#ece5d6;border-radius:6px}
.card p{font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{min-height:44px;padding:0 14px;border:2px solid var(--t);border-radius:22px;background:transparent;font-weight:700;font-size:15px}
.tag.seg{background:var(--t);color:var(--p)}
.tag.fu{border-width:4px}
.src{font-size:14px;color:var(--t2)}
.expl{font-size:15px;background:#ece5d6;border-left:4px solid var(--t);padding:8px 10px;display:none}
.expl.on{display:block}
footer.nav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px;max-width:900px;width:100%;margin:0 auto}
.nb{width:52px;height:52px;border:3px solid var(--t);background:transparent;border-radius:50%;font-size:24px;line-height:1}
.nb:disabled{opacity:.3}
.cnt{font-family:"Archivo Black",Arial,sans-serif;font-size:18px}
/* quiz */
#v3{overflow-y:auto;padding:20px 22px 28px;display:none}
#v3.on{display:block}
#v3>div{max-width:560px;margin:0 auto}
.qn{font-size:14px;font-weight:700;color:var(--t2)}
#v3 h2{font-size:clamp(22px,6.4vw,30px);margin:6px 0 14px}
.op{display:block;width:100%;min-height:56px;text-align:left;padding:10px 14px;margin-bottom:10px;border:3px solid var(--t);border-radius:6px;background:transparent}
.op.ok{border-color:var(--r);color:var(--r);font-weight:700}
.op.no{opacity:.45}
.fb{margin:6px 0 14px;font-size:17px;min-height:26px}
.score{font-size:clamp(60px,20vw,96px);color:var(--r);font-family:"Archivo Black",Arial,sans-serif;line-height:1}
.fin{margin-top:18px}
.fin h3{font-size:clamp(22px,6.4vw,30px);margin-top:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.fuentes{margin-top:22px;font-size:14px;color:var(--t2);border-top:2px solid var(--t);padding-top:12px}
.fuentes p+p{margin-top:6px}
@media (prefers-reduced-motion:reduce){.roll{animation:none}.scroller{scroll-behavior:auto}}
</style>
</head>
<body>

<main>
<section class="view on" id="v1" aria-label="Portada">
  <div>
    <h1><span class="n">36</span> años. De un castillo en Okinawa a un dōjō en Tokio.</h1>
    <p class="sub">Desliza el rollo de 1921 a 1957.</p>
  </div>
  <svg class="roll" viewBox="0 0 320 190" role="img" aria-label="Silueta de karateka en saludo delante de un rollo, entre el tejado de un castillo y el de un dōjō">
    <rect x="30" y="30" width="260" height="120" class="pp" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="22" y="24" width="12" height="132" rx="6" class="fg"/><rect x="286" y="24" width="12" height="132" rx="6" class="fg"/>
    <!-- castillo -->
    <path class="fg" d="M42 80h50l-6-10H48zM52 70l12-14 12 14zM46 80h42v6H46z"/><rect x="52" y="86" width="26" height="40" class="fg"/>
    <!-- dojo -->
    <path class="fg" d="M228 84h56l-10-14h-36zM236 84v42h40V84z"/><circle cx="256" cy="96" r="5" class="rd"/>
    <!-- karateka rei -->
    <circle cx="160" cy="66" r="12" class="fg"/><path class="fg" d="M146 82h28l8 52h-44zM140 134h40v8h-40z"/><rect x="146" y="106" width="28" height="5" class="rd"/>
    <path d="M30 150h260" class="ln"/>
  </svg>
  <div>
    <button class="btn" id="go" style="width:100%">Empezar</button>
    <p class="aviso">Cada hito indica su nivel de certeza.</p>
  </div>
</section>

<section class="view" id="v2" aria-label="Línea temporal">
  <header><div class="rule" id="rule" role="group" aria-label="Años de la línea temporal"></div></header>
  <div class="scroller" id="sc" tabindex="0" aria-label="Rollo de hitos, desliza hacia la izquierda"></div>
  <footer class="nav">
    <button class="nb" id="pv" aria-label="Hito anterior">&larr;</button>
    <span class="cnt" id="cnt" aria-live="polite">1 / 12</span>
    <button class="nb" id="nx" aria-label="Hito siguiente">&rarr;</button>
  </footer>
</section>

<section class="view" id="v3" aria-label="Quiz y cierre"><div id="q"></div></section>
</main>

<script>
const $=s=>document.querySelector(s);
const P='<rect x="0" y="118" width="300" height="3" class="fg"/>';
const pers=(x,y=118,h=40,c='fg')=>`<circle cx="${x}" cy="${y-h-6}" r="6" class="${c}"/><path class="${c}" d="M${x-7} ${y-h}h14l4 ${h}h-22z"/>`;
const ppl=(xs,c)=>xs.map(x=>pers(x,118,30,c)).join('');
const roof=(x,w,h=18)=>`<path class="fg" d="M${x} 70h${w}l-8 -${h}h-${w-16}z"/><path class="fg" d="M${x+6} 74h${w-12}v6h-${w-12}z"/>`;
const flame=(x,y,s=1)=>`<path class="rd" transform="translate(${x} ${y}) scale(${s})" d="M0 0c-14-14-4-26 0-38 2 10 16 14 16 28 0 6-4 10-8 10 4-8-2-14-8-10 0 4 0 6 0 10z"/>`;
const S={
1:roof(70,160,22)+'<rect x="90" y="80" width="120" height="38" class="fg"/>'+ppl([40,60,240,260])+pers(150,118,22,'pp')+'<path d="M276 92l4-10 4 10z" class="rd"/>',
2:'<path class="fg" d="M20 118V80h18v38zM44 118V60h22v58zM72 118V90h16v28zM232 118V70h20v48zM258 118V86h22v48z"/>'+pers(150)+'<rect x="136" y="96" width="28" height="6" class="rd"/>'+P,
3:pers(100)+pers(200,118,40,'pp')+'<path class="ln" d="M200 118V78M190 118V82M210 118V82"/><path class="ln" d="M108 76l16 10M192 76l-16 10"/>'+P+'<path class="ln" d="M96 72q6-8 12 0M194 72q6-8 12 0"/>',
4:'<path class="pp ln" d="M60 30l90 10 90-10v80l-90 10-90-10z"/><path class="ln" d="M150 40v80"/><circle cx="105" cy="62" r="5" class="fg"/><path class="ln" d="M105 67v16M97 76h16M99 96l6-10 6 10"/><circle cx="195" cy="62" r="5" class="fg"/><path class="ln" d="M195 67v14l-10 12M195 81l10 12M188 76h14"/>'+P,
5:'<path class="fg" d="M90 118V58h120v60zM80 58l70-24 70 24z"/>'+flame(120,118,1.4)+flame(160,118,1.8)+flame(195,118,1.2)+'<path class="lr" d="M100 40q-10-14 0-26M210 38q10-14 0-26"/>'+P,
6:'<ellipse cx="150" cy="95" rx="70" ry="10" class="ln pp"/>'+pers(95,110,26)+pers(205,110,26)+pers(120,92,22)+pers(180,92,22)+'<circle cx="150" cy="62" r="6" class="ln"/><path class="ln" d="M142 108q8 6 16 0" />'+P,
7:'<rect x="100" y="20" width="100" height="78" class="pp ln"/><path class="ln" d="M120 40h60M150 40v44M126 60q24 10 48 0M130 82q20-10 40 0"/><rect x="146" y="98" width="8" height="20" class="fg"/>'+P+'<circle cx="100" cy="20" r="4" class="rd"/><circle cx="200" cy="20" r="4" class="rd"/>',
8:'<path class="fg" d="M70 56h160l-14-24H84z"/><rect x="84" y="56" width="132" height="62" class="fg"/><rect x="132" y="76" width="36" height="42" class="pp"/><path class="ln" d="M60 78v20" /><ellipse cx="60" cy="100" rx="9" ry="13" class="rd"/><ellipse cx="240" cy="100" rx="9" ry="13" class="rd"/>'+P,
9:'<path class="fg" d="M30 118V62h90v56zM24 62l51-24 51 24z"/>'+flame(55,118,1.6)+flame(95,118,1.9)+flame(120,70,1)+pers(250,118,26)+'<path class="ln" d="M180 30v88" stroke-dasharray="2 8"/>'+P,
10:'<path class="fg" d="M170 118V50h110v68zM162 50l63-22 63 22z"/><rect x="214" y="78" width="24" height="40" class="pp"/>'+pers(130,118,36)+'<path class="lr" d="M150 86h50M192 78l8 8-8 8"/>'+'<rect x="146" y="92" width="24" height="5" class="rd" opacity="0"/>'+P,
11:'<circle cx="150" cy="68" r="46" class="pp ln"/><circle cx="150" cy="68" r="34" class="ln"/><path class="ln" d="M150 38v60M120 68h60"/><circle cx="150" cy="68" r="9" class="rd"/><rect x="104" y="108" width="92" height="10" class="fg"/>',
12:pers(150,118,52)+'<rect x="141" y="86" width="18" height="5" class="rd"/><path class="ln" d="M20 118h260"/>'+[[60,30],[90,60],[210,40],[240,70],[110,24],[190,80],[40,92],[262,100]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#C8102E" opacity=".55"/>`).join('')
};
const H=[
[1921,'Exhibición en el castillo de Shuri','Funakoshi dirige una exhibición de karate de alumnos de instituto en el castillo de Shuri. Hirohito, entonces príncipe heredero, pasaba por Okinawa rumbo a Europa.',[['Según fuentes']],'Shōtōkai'],
[1922,'El karate llega a Tokio','Funakoshi viaja a Tokio y presenta el karate en la primera exposición de budō (artes marciales) y educación física del Ministerio de Educación, con rollos de kata ilustrados.',[['Seguro','año; sin día']],'Shōtōkai, JKA, Funakoshi 1957'],
[1922,'¿Kata en el Kōdōkan?','Según la JKA, tras la exposición Funakoshi hizo una demostración de kata en el Kōdōkan, invitado por Jigorō Kanō. Shōtōkai y el propio Funakoshi (1957) no lo recogen.',[['Según fuentes',,1]],'JKA (sin fecha)'],
[1922,'Primer libro: Ryūkyū Kenpō: Karate','Funakoshi publica su primer libro, ilustrado con dibujos. Su título aparece en Funakoshi (1957) y en la JKA: Ryūkyū Kenpō (el «puño de Ryūkyū») y Karate.',[['Seguro']],'Funakoshi 1957, JKA'],
[1923,'Arde el Museo de Educación','El terremoto de Kantō destruye el Museo de Educación de Tokio. Pudo ser sede de la exposición de 1922, pero eso es solo una hipótesis de un autor.',[['Según fuentes',,1]],'ryukyu-bugei (Nakamura et al. 2008)'],
[1936,'Naha discute el nombre, no decide','25 de octubre: maestros de Okinawa se reúnen en Naha y hablan de escribir karate con «vacío» en vez de «China». No deciden nada. Funakoshi no figura entre los asistentes.',[['Según fuentes']],'Toyama 1960 (traducción)'],
[1936,'Su asociación se llama Shōtōkai','En Tokio, la asociación de Funakoshi pasa a llamarse Dai Nippon Karate-dō Shōtōkai.',[['Seguro']],'Shōtōkai'],
[1939,'Se inaugura el dōjō Shōtōkan','El 29 de enero se inaugura en Zōshigaya, Tokio, el dōjō Shōtōkan.',[['Seguro']],'Shōtōkai'],
[1945,'Arde el dōjō; muere Yoshitaka','El dōjō Shōtōkan arde en los bombardeos de Tokio. Ese mismo año, más tarde, muere Yoshitaka, hijo de Gichin, de tuberculosis. No murió en el incendio.',[['Seguro','incendio'],['Según fuentes','Yoshitaka']],'Shōtōkai, JKA; Yoshitaka: una fuente secundaria'],
['1945–1952','Ocupación: clubes sin reconocimiento oficial','Con la prohibición del budō aplicada también al karate, queda fuera de escuelas y universidades. Sobrevive en clubes universitarios sin reconocimiento oficial.',[['Según fuentes']],'Svinth, 2002'],
['1948–1949','Finales de los 40: nace la JKA','Se funda la Japan Karate Association, con Funakoshi como Maestro Supremo. Dos páginas de la propia JKA dan fechas distintas: noviembre de 1948 y 1949.',[['Según fuentes']],'JKA (dos páginas)'],
[1957,'Muere Gichin Funakoshi, 88 años','El 26 de abril de 1957 muere Gichin Funakoshi, a los 88 años. El karate ya se había extendido por Japón gracias a la JKA.',[['Seguro']],'JKA, historia']
];
const Y=[1921,1922,1922,1922,1923,1936,1936,1939,1948,1948,1948,1957]; // posición en la regla
Y[8]=1945;Y[9]=1946;Y[10]=1948;
const sc=$('#sc'),rule=$('#rule');let cur=0;
const EXPL='Seguro = varias fuentes o fuente muy sólida. Según fuentes = una sola fuente abierta o fuentes que discrepan. Leyenda = se cuenta, sin fuente.';
H.forEach((h,i)=>{
  const c=document.createElement('article');c.className='card';c.setAttribute('aria-label',h[0]+', '+h[1]);
  const ital=h[1].replace(/(Ryūkyū Kenpō: Karate)/,'<i>$1</i>');
  c.innerHTML=`<div class="yr">${h[0]}</div><h2>${ital}</h2>
  <svg class="sil" viewBox="0 0 300 140" role="img" aria-label="Ilustración: ${h[1].replace(/"/g,'')}">${S[i+1]}</svg>
  <p>${h[2].replace(/(Ryūkyū Kenpō|Karate)(?=[ :)])/g,m=>m).replace('Ryūkyū Kenpō (','<i>Ryūkyū Kenpō</i> (').replace('y Karate.','y <i>Karate</i>.')}</p>
  <div class="tags">${h[3].map(t=>`<button class="tag ${t[0]=='Seguro'?'seg':''} ${t[2]?'fu':''}" aria-expanded="false">${t[0]}${t[1]?' · '+t[1]:''}</button>`).join('')}</div>
  <div class="expl" role="note">${EXPL}</div>
  <div class="src">Fuente: ${h[4]}</div>`;
  c.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{const e=c.querySelector('.expl');const o=e.classList.toggle('on');b.setAttribute('aria-expanded',o)});
  if(i==11){const b=document.createElement('button');b.className='btn';b.textContent='Ir al quiz';b.onclick=()=>show('v3',startQuiz);c.appendChild(b)}
  sc.appendChild(c);
});
const lbl=new Set([0,11]);
H.forEach((h,i)=>{
  const m=document.createElement('button');m.className='mk'+(lbl.has(i)?' l':'');
  m.style.left=((Y[i]-1921)/36*92+4+ (i>0&&Y[i]==Y[i-1]?(i-[0,1,1,1,4,5,5,8,8,9,10,11].indexOf(i)>0?0:0):0))+'%';
  m.dataset.i=i;m.setAttribute('aria-label',`${h[0]}: ${h[1]}`);m.innerHTML='<i></i><b>'+String(h[0]).slice(0,4)+'</b>';
  m.onclick=()=>go(i);rule.appendChild(m);
});
// separar marcas del mismo año
(()=>{const w=rule.clientWidth||340;const ms=[...rule.children];for(let i=1;i<ms.length;i++){const a=ms[i-1].offsetLeft,b=ms[i].offsetLeft;if(b-a<20)ms[i].style.left=`calc(${ms[i].style.left} + ${20-(b-a)}px)`}})();
function go(i,smooth=true){i=Math.max(0,Math.min(11,i));sc.scrollTo({left:i*sc.clientWidth,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches||!smooth?'auto':'smooth'});upd(i)}
function upd(i){cur=i;$('#cnt').textContent=(i+1)+' / 12';$('#pv').disabled=i==0;$('#nx').disabled=i==11;rule.querySelectorAll('.mk').forEach((m,k)=>{m.classList.toggle('on',k==i);k==i?m.setAttribute('aria-current','true'):m.removeAttribute('aria-current')})}
let t;sc.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{const i=Math.round(sc.scrollLeft/sc.clientWidth);if(i!=cur)upd(i)},60)});
$('#pv').onclick=()=>go(cur-1);$('#nx').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(!$('#v2').classList.contains('on'))return;const k=e.key;
  if(k=='ArrowRight'||k=='PageDown'){go(cur+1);e.preventDefault()}else if(k=='ArrowLeft'||k=='PageUp'){go(cur-1);e.preventDefault()}else if(k=='Home'){go(0);e.preventDefault()}else if(k=='End'){go(11);e.preventDefault()}});
sc.addEventListener('click',e=>{if(e.target.closest('button,.expl'))return;const r=sc.getBoundingClientRect();if(e.clientX-r.left<28)go(cur-1);else if(r.right-e.clientX<28)go(cur+1)});
addEventListener('resize',()=>go(cur,false));
function show(id,cb){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==id));scrollTo(0,0);cb&&cb();if(id=='v2')go(cur,false)}
$('#go').onclick=()=>show('v2');
// quiz
const Q=[
['¿Cómo murió Yoshitaka Funakoshi?',['En el bombardeo del dōjō','De tuberculosis, después del incendio','En el terremoto de 1923'],1,'Según fuentes, murió de tuberculosis en 1945, después del incendio del dōjō. No murió en el bombardeo.'],
['¿Qué decidieron los maestros en la reunión de Naha de 1936?',['Llamarlo karate-dō','Escribirlo con «vacío»','No decidieron nada'],2,'Hablaron de escribir karate con «vacío» en vez de «China», pero no tomaron una decisión formal.'],
['¿Qué pasó con el karate en las universidades durante la ocupación?',['Se enseñaba con normalidad','Quedó fuera de escuelas y universidades, con clubes sin reconocimiento','Se hizo obligatorio'],1,'Sin reconocimiento oficial, sobrevivió en clubes universitarios.']
];
const FU=['Shōtōkai (historia)','JKA (Maestro Supremo; historia)','Funakoshi 1957, trad. Tankosich','ryukyu-bugei','Toyama 1960, reunión de Naha (traducción)','Svinth 2002','Wikipedia EN y Shōtōkai (Yoshitaka)'];
let qi=0,pts=0;
function startQuiz(){qi=0;pts=0;rq()}
function rq(){const box=$('#q');
  if(qi>=3)return fin(box);
  const q=Q[qi];
  box.innerHTML=`<p class="qn">Pregunta ${qi+1} de 3</p><h2>${q[0]}</h2><div>${q[1].map((o,i)=>`<button class="op" data-i="${i}">${'abc'[i]}) ${o}</button>`).join('')}</div><p class="fb" aria-live="polite"></p><div class="btns" id="nb"></div>`;
  box.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i==q[2])pts++;
    box.querySelectorAll('.op').forEach((x,k)=>{x.disabled=true;x.classList.add(k==q[2]?'ok':'no')});
    box.querySelector('.fb').textContent=(i==q[2]?'Correcto. ':'No exactamente. ')+q[3];
    const n=document.createElement('button');n.className='btn';n.textContent=qi<2?'Siguiente':'Ver resultado';n.onclick=()=>{qi++;rq();scrollTo(0,0);$('#v3').scrollTop=0};$('#nb').appendChild(n);n.focus()})}
