<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mano vacía · plano 05</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, P, U } = C.iniciar3D(); const { MV } = C;
window.DURACION = 3.5;
const h = MV.crearHanashiro(), libro = MV.crearLibro({ texto: '空手', tapa: '#E9DFC9' });
esc.escena.add(h.raiz, libro.raiz);
h.colocar(0, 0, 0).aplicarPose(P.recibir);
libro.raiz.scale.set(1.25, 1.25, 1.25);
window.render = (t) => {
  // llega el libro: se alza ligeramente; a mitad (1,7 s) la cámara se acerca y sale la fecha
  const s = U.easeInOut(U.clamp(U.prog(t, 1.5, 2.3))), e = U.easeOut(U.clamp(U.prog(t, 0, 0.6)));
  libro.entre(h.punto('manoI'), h.punto('manoD'), { rumbo: 0, sube: 0.0 + 0.1 * s - 0.08 * (1 - e) });
  libro.raiz.rotation.x = -0.25;
  esc.orbita({ centro: [0, U.lerp(1.05, 1.0, s), 0], distancia: U.lerp(5.2, 4.4, s), azimut: 0, elevacion: 8, fov: 30 });
  esc.dibujar(ctx);
  C.fecha(ctx, '1905', U.clamp(U.prog(t, 1.7, 2.2)), { y: 1290 });
  C.aviso(ctx, t, 'Según él y un historiador', { t0: 1.7 });
  C.tarjeta(ctx, t, ['1905: [r]Hanashiro[/r]'], { t0: 0.1, y: 330 });
};
</script></body></html>
