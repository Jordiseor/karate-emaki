<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mano vacía · plano 11</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, P, U } = C.iniciar3D(); const { Karateka3D, H2 } = C;
window.DURACION = 2.2;
// PLANO 11: cierre. Karateka a cámara abajo, carteles 唐手 / 空手 flotando arriba; final 空手 rojo (y 860, size 470) = bucle con plano 1.
const k = new Karateka3D({ cinturon: 'negro' }); esc.escena.add(k.raiz);
k.colocar(0, 0, 0).aplicarPose(P.yoi);
window.render = (t) => {
  C.papel(ctx);
  k.cara({ sonrisa: 0.6, cejas: 0.3, parpadeo: (t > 0.9 && t < 1.0) ? 1 : 0 });
  esc.orbita({ centro: [0, 2.1, 0], distancia: 12.5, elevacion: 3, fov: 28, alto: 0, azimut: 0 });
  esc.dibujar(ctx);
  const fl = Math.sin(t * 3) * 14;
  // 唐手 flota y se cambia por 空手 (el último rojo grande)
  const a1 = 1 - U.clamp(U.prog(t, 0.9, 1.3));
  const p2 = U.easeInOut(U.clamp(U.prog(t, 1.0, 1.7)));
  const velo = ctx.createLinearGradient(0, 500, 0, 1120); 
  if (a1 > 0) { ctx.save(); ctx.globalAlpha = a1; H2.kanji(ctx, '唐手', 540, 860 + fl, 470, { prog: 1, color: C.TINTA }); ctx.restore(); }
  if (p2 > 0) { ctx.save(); ctx.globalAlpha = U.clamp(p2 * 1.5); H2.kanji(ctx, '空手', 540, 860 + (1 - p2) * fl, 470, { prog: 1, color: C.ROJO }); ctx.restore(); }
  C.tarjeta(ctx, t, ['¿Lo sabías?'], { t0: 0.1, y: 330 });
  const a = U.clamp(U.prog(t, 0.5, 0.8));
  ctx.save(); ctx.globalAlpha = a; ctx.font = '800 54px "Montserrat","Arial Black",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = 16; ctx.strokeStyle = C.PAPEL;
  for (const [txt, y] of [['¿Sabías que era', 1440], ['«mano china»?', 1510]]) { ctx.strokeText(txt, 540, y); ctx.fillStyle = C.TINTA; ctx.fillText(txt, 540, y); }
  ctx.restore();
};
</script></body></html>
