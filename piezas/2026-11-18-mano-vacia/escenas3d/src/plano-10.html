<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mano vacía · plano 10</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, P, U } = C.iniciar3D(); const { MV, H2, mezclar } = C;
window.DURACION = 3.5;
// PLANO 10: Funakoshi (silueta) en yoi, 3/4; a 1,7 s 空 a trazos con halo y las manos se abren.
const f = MV.crearFunakoshi(); f.silueta('#0E0E0E'); esc.escena.add(f.raiz);
for (const l of Object.values(esc.luces)) if (l.intensity !== undefined) l.intensity *= 0.85;
f.colocar(0, 0, 0);
window.render = (t) => {
  C.papel(ctx);
  const ab = U.easeInOut(U.clamp(U.prog(t, 1.7, 2.6)));
  const resp = Math.sin(t * 1.6) * 0.5 + 0.5;
  f.aplicarPose(mezclar(P.yoi, P.yoi, 0)); // base
  f.aplicarPose(mezclar(P.yoi, P['brazos-arriba'], { brazos: 0.22 * ab, resto: 0 }));
  esc.orbita({ centro: [0, 1.80, 0], distancia: 11, elevacion: 3, fov: 28, azimut: 14 - 8 * U.prog(t, 0, 3.5) });
  esc.dibujar(ctx);
  // halo suave tras el kanji
  const ph = U.clamp(U.prog(t, 1.7, 2.7));
  if (ph > 0) { const g = ctx.createRadialGradient(540, 650, 40, 540, 650, 330); g.addColorStop(0, `rgba(244,239,230,${0.85 * ph})`); g.addColorStop(1, 'rgba(244,239,230,0)'); ctx.fillStyle = g; ctx.fillRect(0, 330, 1080, 700); }
  if (t >= 1.7) H2.kanji(ctx, '空', 540, 665, 340, { prog: U.clamp(U.prog(t, 1.7, 2.9)), color: C.ROJO });
  C.tarjeta(ctx, t, ['Sin armas.', 'Sin vanidad.'], { t0: 0.1, y: 330 });
};
</script></body></html>
