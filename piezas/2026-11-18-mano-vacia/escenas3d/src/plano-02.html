<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mano vacía · plano 02</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, P, U } = C.iniciar3D(); const { MV } = C;
window.DURACION = 3.2;
const f = MV.crearFunakoshi(), libro = MV.crearLibro({ texto: '唐手' });
esc.escena.add(f.raiz, libro.raiz);
f.colocar(0, 0, 0).aplicarPose(P.recibir);
libro.raiz.scale.set(1.25, 1.25, 1.25);
window.render = (t) => {
  libro.escribir(U.clamp(U.prog(t, 0.15, 0.9)));
  // el libro se alza ante el pecho a mitad (1,6 s)
  const s = U.easeInOut(U.clamp(U.prog(t, 1.5, 2.3)));
  libro.entre(f.punto('manoI'), f.punto('manoD'), { rumbo: 0, sube: 0.0 + 0.1 * s });
  libro.raiz.rotation.x = -0.25;
  const d = U.lerp(5.2, 3.7, s), cy = U.lerp(1.1, 1.5, s);
  esc.orbita({ centro: [0, cy, 0], distancia: d, azimut: 0, elevacion: 8, fov: 30 });
  esc.dibujar(ctx);
  C.fecha(ctx, '1922', U.clamp(U.prog(t, 0.8, 1.3)), { y: 1520, size: 100 });
  C.tarjeta(ctx, t, ['1922: [r]唐手[/r],', 'mano china'], { t0: 0.1, y: 330 });
};
</script></body></html>
