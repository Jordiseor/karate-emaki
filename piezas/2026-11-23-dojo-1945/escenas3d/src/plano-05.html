<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Dojo 1945 · plano 05</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from "./comun.js";
const { ctx, esc, U, H3, H2 } = C.iniciar('atardecer', { casa: false, colina: false });
window.DURACION = 2.3;
// PLANO 5: mar de pinos desde arriba, olas; 松濤 en rojo.
const mar = H3.crearMarDePinos(); esc.escena.add(mar.raiz);
window.render = (t) => {
  mar.actualizar(t, { olas: U.prog(t, 0.3, 1.8) });
  esc.mirar([0, 16 + 3 * U.prog(t, 0, 2.3), 22], [0, 0, -4], 40);
  esc.dibujar(ctx);
  H2.kanji(ctx, '松濤', 540, 1000, 260, { prog: U.prog(t, 0.2, 1.3), halo: true });
  C.tarjeta(ctx, t, ['松濤 = olas de pino'], { t0: 0.4, y: 300 });
};
</script></body></html>
