<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Dojo 1945 · plano 04</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from "./comun.js";
const { ctx, esc, casa, U, H2 } = C.iniciar('calle', { calle: true });
window.DURACION = 2.3;
// PLANO 4: la cámara se acerca al rótulo; 松濤館 se escribe en rojo y 館 golpea.
casa.escribirRotulo('松濤館', 1);
window.render = (t) => {
  const e = U.easeInOut(U.prog(t, 0, 2.3));
  esc.orbita({ centro: casa.medidas.rotulo.toArray(), distancia: 21 - 12 * e, azimut: 12 - 8 * e, elevacion: 6, fov: 32 });
  esc.dibujar(ctx);
  H2.kanji(ctx, '松濤館', 540, 960, 230, { prog: U.prog(t, 0.2, 1.2), halo: true });
  H2.kanjiGolpe(ctx, '館', 540 + 230, 960, 230, U.prog(t, 1.2, 1.7));
  C.tarjeta(ctx, t, ['松濤館', '= casa de Shōtō'], { t0: 0.4, y: 300 });
};
</script></body></html>
