<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../../animacion/marca.js"></script>
<script type="module">
// Plano 4 (6–8 s): mokusō. Ojos cerrados, dos respiraciones. Primer plano de tronco y cara con empuje lento (zoom 1,0→1,12). 黙想 pequeño.
import { crearToma, ctx, titulo, H2, U, TINTA, DURACION, INICIO } from './comun.js';
const toma = crearToma(); window.DURACION = DURACION[4];
window.render = (t) => {
  const T = INICIO[4] + t; toma.fijar(T);
  const z = 1 + 0.12 * U.easeInOut(U.prog(t, 0, 2));
  toma.esc.orbita({ centro: [0, 1.0, 0], distancia: 3.6 / z, azimut: 0, elevacion: 2, fov: 26 });
  window.EMAKI.fondoPapel(ctx); toma.esc.dibujar(ctx);
  H2.kanji(ctx, '黙想', 900, 560, 120, { prog: U.prog(t, 0.1, 0.8), color: TINTA, alpha: 0.95 });
  titulo(ctx, t, ['Mokusō: silencio', 'y respiración'], 0.0, 99);
};
</script></body></html>
