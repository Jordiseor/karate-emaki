<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Ascensor · plano 09</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, P, A, B, dA, dB, U } = C.iniciar();
window.DURACION = 3.2;
// PLANO 9 (23,4–26,6): B de perfil a pantalla completa. Flecha vertical roja que crece; flecha horizontal gris corta que NO crece.
A.raiz.visible = false;
window.render = (t) => {
  EMAKI.fondoPapel(ctx);
  const tau = 0.5 * t + 0.55;
  dB.limpiar();
  C.poner(B, 'B', P, tau);
  const x = C.VEL * tau, cad = C.caderaPt(B, 'B', P, tau); C.poner(B, 'B', P, tau);
  esc.orbita({ centro: [x + 0.15, 0.95, 0], distancia: 8, azimut: 0, elevacion: 3, fov: 22 });
  // vertical: detrás del torso, crece
  const g = U.easeOut(U.prog(t, 0.3, 2.2)), xv = x - 0.5;
  dB.flecha({ desde: [xv, 0.85, 0.2], hacia: [xv, 1.75, 0.2], crecer: g, color: C.ROJO, grosor: 0.03, punta: 0.16 });
  // horizontal: corta y fija (no crece), gris
  const a = U.prog(t, 0.3, 0.7);
  dB.flecha({ desde: [x + 0.62, 1.12, 0.2], hacia: [x + 0.84, 1.12, 0.2], crecer: 1, alfa: a, color: C.GRIS, grosor: 0.03, punta: 0.1 });
  dB.etiqueta([xv, 0.7, 0.2], 'sube', { color: C.ROJO, alfa: g });
  dB.etiqueta([x + 0.75, 1.3, 0.2], "no crece", { color: C.GRIS, alfa: a, desplaza: [0, -10] });
  esc.dibujar(ctx, {});
  dB.dibujar2D(ctx);
  C.tarjeta(ctx, t, ['No empuja', 'hacia delante'], { t0: 0.1 });
};
</script></body></html>
