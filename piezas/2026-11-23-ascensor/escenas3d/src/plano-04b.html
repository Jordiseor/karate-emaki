<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Ascensor · plano 04b</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, P, A, B, dA, dB, U } = C.iniciar();
window.DURACION = 2.3;
// PLANO 4b (9,5–11,8): solo A de perfil, 4 pasos (tau acelerado: 4 × 1,1 s en 2,3 s). Punto rojo en la cadera y línea discontinua horizontal a 0,81 m.
const RATE = 4 * C.T_PASO / 2.3;
window.render = (t) => {
  EMAKI.fondoPapel(ctx);
  const tau = 0.55 + RATE * t;
  dA.limpiar(); dB.limpiar(); B.raiz.visible = false;
  const cad = C.caderaPt(A, 'A', P, tau).clone();
  C.poner(A, 'A', P, tau);
  const xc = C.VEL * tau + 0.3;
  dA.linea([xc - 2.2, cad.y, 0], [xc + 2.2, cad.y, 0], { discontinua: true, color: C.GRIS, grosor: 0.008 });
  dA.cdm({ punto: [cad.x, cad.y, 0], vertical: false, radio: 0.05 });
  esc.orbita({ centro: [xc - 0.15, 1.0, 0], distancia: 8, azimut: 0, elevacion: 3, fov: 22 });
  esc.sombraEn(xc, 0); esc.dibujar(ctx, {});
  C.tarjeta(ctx, t, ['La cadera no', 'cambia de nivel'], { t0: 0.05 });
  C.letraPequena(ctx, ['Oi-zuki: “the hips level should not', 'change while moving”']);
};
</script></body></html>
