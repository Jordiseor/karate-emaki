<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Ascensor · plano 11</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, P, A, B, dA, dB, U } = C.iniciar();
window.DURACION = 3.6;
// PLANO 11 (29,8–33,4): A a pantalla completa en oi-zuki despacio, con el móvil en trípode que lo graba; su cabeza deja una línea recta.
// De 2,8 a 3,6 s fundido a la pantalla partida del plano 1; el último fotograma = fotograma 0 del plano 1 (zoom 1, PRE 0,55, tarjeta «Tu cabeza sube y baja»).
const PRE = 0.55, TF = 3.6;
window.render = (t) => {
  EMAKI.fondoPapel(ctx);
  const a2 = U.easeInOut(U.prog(t, 3.0, 3.5));          // peso de la pantalla partida
  if (a2 < 1) {
    // --- escena A sola + móvil
    B.raiz.visible = false;
    const f = (s) => 0.5 * s + PRE, tau = f(t);
    dA.limpiar();
    C.poner(A, 'A', P, tau);
    dA.rastro((s) => C.cabeza(A, 'A', P, f(s)), { t, ventana: 3, color: C.ROJO, muestras: 50, grosor: 0.016 });
    C.poner(A, 'A', P, tau);
    esc.orbita({ centro: [C.VEL * tau - 0.25, 0.95, 0], distancia: 8, azimut: 0, elevacion: 3, fov: 22 });
    esc.dibujar(ctx, {});
    B.raiz.visible = true;
    overlay_movil(ctx, t);
    C.tarjeta(ctx, t, ["¿Sube", "tu cabeza?"], { t0: 0.1 });
  }
  if (a2 > 0) {
    // --- pantalla partida del plano 1 (en t1 = 0 al final), encima con alfa
    ctx.save(); ctx.globalAlpha = a2;
    EMAKI.fondoPapel(ctx);
    const tau = PRE + (t - TF);
    for (const q of ['A', 'B']) {
      const k = q === 'A' ? A : B, d = q === 'A' ? dA : dB;
      dA.limpiar(); dB.limpiar();
      C.poner(k, q, P, tau);
      d.rastro((s) => C.cabeza(k, q, P, s + PRE), { t: 0, ventana: 2, color: C.ROJO, muestras: 44, grosor: 0.016, punta: t >= 3.5 });
      C.poner(k, q, P, tau);
      C.dibujarBanda(ctx, esc, q, C.X0[q] + C.VEL * tau + 0.15, { zoom: 1, ocultar: [q === 'A' ? B : A] });
    }
    C.separador(ctx);
    if (t >= 3.4) C.tarjeta(ctx, t, 'Tu cabeza sube y baja', { t0: -1 });
    ctx.restore();
  }
};
function overlay_movil(ctx, t) {
  const a = U.prog(t, 0.2, 0.6) * (1 - U.prog(t, 3.0, 3.4));
  C.overlay.movilTripode(ctx, 190, 1500, { size: 560, alfa: a, cono: U.prog(t, 0.6, 1.2) });
}
</script></body></html>
