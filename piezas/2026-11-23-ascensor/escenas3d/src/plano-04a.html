<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Ascensor · plano 04a</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, U } = C.iniciar();
window.DURACION = 1.5;
// PLANO 4a (8,0–9,5): fondo papel; página de manual 2D que entra desde la derecha y queda en primer plano. Sello JKA rojo.
function pagina(ctx, x, y, w, h, rot, sello) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(26,26,26,0.28)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
  ctx.fillStyle = '#FFFDF8'; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = C.TINTA; ctx.lineWidth = 4; ctx.strokeRect(-w / 2, -h / 2, w, h);
  // cabecera y líneas de texto (grises)
  ctx.fillStyle = C.TINTA; ctx.fillRect(-w / 2 + 40, -h / 2 + 50, w * 0.5, 22);
  ctx.fillStyle = C.GRIS;
  for (let i = 0; i < 4; i++) ctx.fillRect(-w / 2 + 40, -h / 2 + 110 + i * 34, w - 80 - (i === 3 ? 200 : 0), 12);
  // esquema: figura de palos con línea de cadera
  ctx.strokeStyle = C.GRIS; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const cx = 0, cy = 30;
  ctx.beginPath(); ctx.arc(cx, cy - 150, 26, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 122); ctx.lineTo(cx, cy + 20); ctx.moveTo(cx, cy - 90); ctx.lineTo(cx + 90, cy - 80);
  ctx.moveTo(cx, cy + 20); ctx.lineTo(cx + 60, cy + 100); ctx.lineTo(cx + 40, cy + 190); ctx.moveTo(cx, cy + 20); ctx.lineTo(cx - 50, cy + 100); ctx.lineTo(cx - 80, cy + 190); ctx.stroke();
  ctx.setLineDash([14, 12]); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-w / 2 + 50, cy + 20); ctx.lineTo(w / 2 - 50, cy + 20); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C.GRIS;
  for (let i = 0; i < 5; i++) ctx.fillRect(-w / 2 + 40, cy + 250 + i * 34, w - 80 - (i === 4 ? 260 : 0), 12);
  // sello JKA
  ctx.globalAlpha = sello; ctx.translate(w / 2 - 130, h / 2 - 130); ctx.rotate(-0.25);
  ctx.strokeStyle = C.ROJO; ctx.fillStyle = C.ROJO; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.arc(0, 0, 82, 0, 6.2832); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 68, 0, 6.2832); ctx.lineWidth = 3; ctx.stroke();
  ctx.font = '900 70px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('JKA', 0, 4);
  ctx.restore();
}
window.render = (t) => {
  EMAKI.fondoPapel(ctx);
  const e = U.easeInOut(U.prog(t, 0, 0.9));
  const x = 540 + (1 - e) * 900, rot = 0.10 * (1 - e) - 0.015, sc = 1 + 0.02 * U.easeOut(U.prog(t, 0.9, 1.5));
  ctx.save(); ctx.translate(540, 900); ctx.scale(sc, sc); ctx.translate(-540, -900);
  pagina(ctx, x, 900, 640, 900, rot, U.easeOut(U.prog(t, 0.7, 1.0)));
  ctx.restore();
  C.tarjeta(ctx, t, 'Manual técnico JKA', { t0: 0.05 });
  C.letraPequena(ctx, ['JKA Technical Division, Technical Manual', 'for the Instructor, 2008']);
};
</script></body></html>
