<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Ascensor · plano 08</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from "./comun.js";
const { ctx, esc, P, A, B, dA, dB, U } = C.iniciar();
A.raiz.visible = false;
// Helper local (plan: pendiente): B a pantalla completa, a la izquierda del cuadro, cámara que lo sigue. 620 px/m aprox.
const vista = (tau, off = 0.25) => { C.poner(B, "B", P, tau); const x = C.VEL * tau; esc.orbita({ centro: [x + off, 0.95, 0], distancia: 9, azimut: 0, elevacion: 3, fov: 22 }); esc.sombraEn(x, 0); return x; };
const px = (p) => esc.proyectar(p);
window.DURACION = 3.2;
// PLANO 8: B baja; flecha roja ↑ (se desvanece) y gris ↓; la cifra baja de 34 a ≈ 20 J sin llegar a cero.
window.render = (t) => {
  const tau = 0.55 + 0.55 * U.prog(t, 0.2, 3.0);
  const x = vista(tau);
  dB.limpiar();
  const xa = x - 0.4;
  dB.flecha({ desde: [xa, 0.9, 0], hacia: [xa, 1.5, 0], alfa: 1 - U.prog(t, 0.3, 0.7), color: C.ROJO });
  dB.flecha({ desde: [xa, 1.5, 0], hacia: [xa, 0.9, 0], crecer: U.prog(t, 0.5, 1.2), color: C.GRIS });
  esc.dibujar(ctx, {});
  const n = Math.round(34 - 14 * U.easeInOut(U.prog(t, 0.8, 2.8)));
  C.overlay.cifra(ctx, 790, 1060, n + ' J', { size: 200 });
  C.etiqueta(ctx, 'parte', 790, 1220, { size: 64, alpha: U.prog(t, 1.6, 2.0) });
  C.tarjeta(ctx, t, ['Parte vuelve', 'al bajar'], { t0: 0.05, size: 76 });
  C.letraPequena(ctx, 'Modelo simplificado');
};
</script></body></html>
