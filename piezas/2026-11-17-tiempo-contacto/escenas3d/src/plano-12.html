<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Tiempo de contacto · plano 12</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const S = C.iniciar(); const { ctx, esc, P, U } = S;
window.DURACION = 2.5;
// PLANO 12: karateka frontal, encoge de hombros, cara de duda, dos flechas pequeñas con «?» sobre las manos.
const k = S.izq.k; S.der.k.raiz.visible = false; S.der.pad.visible(false); S.izq.pad.visible(false);
k.colocar(0, 0, 0); esc.sombraEn(0, 0);
function flechaQ(x, y, a) {   // flecha roja corta hacia abajo con «?» encima, 2D
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.ROJO; ctx.strokeStyle = C.ROJO; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y - 90); ctx.lineTo(x, y - 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 30, y - 38); ctx.lineTo(x + 30, y - 38); ctx.lineTo(x, y + 4); ctx.closePath(); ctx.fill();
  ctx.font = '900 96px "Montserrat","Arial Black",system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(244,239,230,0.95)'; ctx.lineJoin = 'round'; ctx.strokeText('?', x, y - 108); ctx.fillText('?', x, y - 108);
  ctx.restore();
}
window.render = (t) => {
  const f = U.easeBack(U.prog(t, 0.15, 1.0));
  k.aplicarPose(C.mezclar(P.neutra, P['encoge-hombros'], f));
  k.cara({ cejas: 0.5 * U.prog(t, 0.1, 0.8), sonrisa: 0.15 * U.prog(t, 0.1, 0.8), torcida: 0.4 * U.prog(t, 0.1, 0.8), asimetria: 0.6 * U.prog(t, 0.1, 0.8), parpadeo: U.parpadeo(t, [1.9]) });
  esc.orbita({ centro: [0, 1.2, 0], distancia: 7.6, azimut: 0, elevacion: 3, fov: 26 });
  esc.dibujar(ctx, {});
  const a = U.easeOut(U.prog(t, 0.9, 1.3)), bob = 6 * Math.sin(t * 5);
  ['manoD', 'manoI'].forEach((n) => { const p = esc.proyectar(k.punto(n)); flechaQ(p.x, p.y - 30 + bob, a); });
  C.tarjeta(ctx, t, ['Modelo: aún sin medir'], { t0: 0.1, y: 350, size: 72 });
  C.etiquetaModelo(ctx);
  C.letraPequena(ctx, ['No se ha encontrado ningún estudio', 'que compare kime y empujón']);
};
</script></body></html>
