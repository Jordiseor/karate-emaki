<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Tiempo de contacto · plano 11</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
// Plano 11 (2D, sin 3D): dos columnas de fuerza con el mismo impulso. 1750 N (rojo, 16 ms) y 875 N (32 ms).
const ctx = document.getElementById('c').getContext('2d');
window.DURACION = 2.5;
window.render = (t) => {
  window.EMAKI.fondoPapel(ctx);
  const U = C.U;
  C.K.columnas(ctx, { caja: { x: 190, y: 660, w: 700, h: 500 }, max: 1750, barras: [
    { valor: 875, texto: '875 N', etiqueta: '32 ms', prog: U.prog(t, 0.2, 0.9) },
    { valor: 1750, texto: '1750 N', etiqueta: '16 ms', color: C.ROJO, prog: U.prog(t, 0.5, 1.3) }] });
  const a = U.easeOut(U.prog(t, 1.3, 1.7));
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.TINTA; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 60px "Montserrat","Arial Black",system-ui,sans-serif'; ctx.fillText('mismo impulso', 540, 1305 - 10 * (1 - a)); ctx.restore();
  C.tarjeta(ctx, t, ['[r]1750 N[/r] frente a 875 N'], { t0: 0.1, y: 380, size: 72 });
  C.etiquetaModelo(ctx);
  C.letraPequena(ctx, ['Modelo simplificado · impulso de ejemplo', '28 N·s (Mašić 1987: 21,9–40,7)', 'no medido en karatekas']);
};
</script></body></html>
