<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Kumite v2 · plano 01</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const S = C.iniciar(); const { ctx, esc, aka, ao, par, P } = S; const U = C.U;
window.DURACION = 3.5;
window.render = (t) => {
  aka.aplicarPose(P.kamae); ao.aplicarPose(P.kamae);
  const b = 1 + 0.008 * Math.sin(t * 2.2); aka.raiz.scale.y = b; ao.raiz.scale.y = 1 + 0.008 * Math.sin(t * 2.2 + 0.6);
  aka.cara({ cejas: -0.5, parpadeo: 0 }); ao.cara({ ojos: 0.6, cejas: 0.5, parpadeo: 0 });
  C.cam(S, C.CAM_BASE);
  esc.dibujar(ctx, {});
  C.tarjeta(ctx, t, ['¿Cuánto vale', 'cada golpe?'], null, { t0: -1 });
};
</script></body></html>
