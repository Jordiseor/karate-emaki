<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Kumite v2 · plano 02</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const S = C.iniciar(); const { ctx, esc, aka, ao, par, P } = S; const U = C.U;
window.DURACION = 3.5;
const X = C.crearTecnica(par, P, 'gyaku-zuki-chudan');
window.render = (t) => {
  X.poner(t - C.T0);
  aka.cara({ cejas: -0.5, parpadeo: 0 }); ao.cara({ ojos: 0.6, cejas: 0.5, parpadeo: 0 });
  C.cam(S, { ...X.camara, azimut: -90 });   // la librería usa +90 para el puñetazo y deja a aka a la derecha: aquí −90
  esc.dibujar(ctx, {});
  C.impacto(S, t, 1, ["pecho"], 'manoD');
  C.tarjeta(ctx, t, ["Puñetazo: [r]1[/r] punto"], ["yūko"]);
};
</script></body></html>
