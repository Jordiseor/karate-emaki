<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Kumite · plano 06</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const S = C.iniciar(); const { ctx, esc, aka, ao, par, U } = S;
window.DURACION = 2.5;
// PLANO 6 (2,5 s): vista alta, karatekas quietos en kamae; marcador 3; aparece la regla vacía de seis casillas.
window.render = (t) => {
  const r = Math.sin(t * 3) * 0.5 + 0.5;
  aka.colocar(aka.base.x, aka.base.z, aka.base.rumbo);
  aka.aplicarPose(C.mezclar(S.P.kamae, S.P.kamae, 0)); ao.aplicarPose(S.P.kamae);
  C.cam(esc, par, { ...C.CAM.alto, azimut: 90, centro: [0, -0.3, 0], distancia: 14 - 0.8 * U.easeInOut(U.prog(t, 0, 2.5)) });
  esc.dibujar(ctx, {});
  C.marcador(ctx, 3, 0, { alfa: 1 });
  C.regla(ctx, 0, { y: 940, aparece: U.easeOut(U.prog(t, 0.3, 0.9)) });
  C.tarjeta(ctx, t, ['6 criterios,', 'todos a la vez'], { t0: 0.1, y: 280 });
};
</script></body></html>
