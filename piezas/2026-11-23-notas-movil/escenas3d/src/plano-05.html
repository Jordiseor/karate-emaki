<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>notas-movil · plano 05</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from "./comun.js";
const { U, N } = C;
const CAJA = { x: 90, y: 260, w: 900, h: 300 };
const nota = (ctx, lineas, p) => { const h = N.marco(ctx, { caja: CAJA }); lineas.forEach((l, i) => N.escribir(ctx, h, l, { y: 120 + i * 100, size: 72, p: i === 0 ? p * 2 : p * 2 - 1 })); return h; };
const S = C.iniciar({ rumbo: 90, extras: [{ cinturon: 'verde' }] }), { ctx, esc, P, k, otros } = S, v = otros[0];
window.DURACION = C.DUR[4];
const pulso = (t, a) => U.easeInOut(U.prog(t, a, a + 0.22)) * (1 - U.easeInOut(U.prog(t, a + 0.4, a + 0.65)));
const ciclo = (t) => Math.max(pulso(t, 0.2), pulso(t, 0.95));
window.render = (t) => {
  const fv = ciclo(t), fb = ciclo(t - 0.3);
  v.colocar(0, 0, 90); v.aplicarPose(C.mezclar(P.yoi, P['choku-zuki-kiai'], fv));
  v.cara({ ...C.CARAS.kiai, grito: 0.5 * fv, cejas: -0.5 * fv });
  k.colocar(-1.1, 0, 90); k.aplicarPose(C.mezclar(P.yoi, P['choku-zuki-kiai'], fb)); k.cara({ cejas: 0.2 });
  esc.orbita({ ...C.CAM.media, centro: [-0.1, 1.4, 0], distancia: 10, azimut: 0 });
  esc.sombraEn(0, 0); esc.sombraEn(-1.1, 0); esc.dibujar(ctx, { vineta: true });
  nota(ctx, ['Sempai: veterano.', 'Imitarle.'], U.prog(t, 0, 0.3));
  C.etiqueta(ctx, t, { pre: 'Sempai (', jp: '先輩', post: '): más experiencia', t0: 0.3 });
};
</script></body></html>
