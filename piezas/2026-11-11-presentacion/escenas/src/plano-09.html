<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../../animacion/marca.js"></script>
<script type="module">
// Plano 9 (18,0–20,2 s): el rollo cerrado y atado (último fotograma del 8) se desata y se abre «como un sol» (0,05–1,05 s; acento del
// logo a 0,0) y deja la cara del logo, que guiña a 1,2 s. Tarjeta «Síguenos» 1,0–1,75 s y se retira antes del final: el ÚLTIMO fotograma
// (t = 2,2) es exactamente el fotograma 0 del plano 1 (logo.personaje(P); logo.actualizar(0); logo.dibujar(ctx, 0), escala 1, cy 960).
import { crearEscenario, util as U } from '../../../../animacion/3d/escenario.js';
import { Karateka3D, cargarPoses } from '../../../../animacion/3d/karateka3d.js';
import { crearRollo } from '../../../../animacion/3d/rollo2d.js';
import { crearLogo, LOGO } from '../../../../animacion/3d/logo3d.js';
const ctx = document.getElementById('c').getContext('2d');
const esc = crearEscenario({ escala: 1 });
const P = cargarPoses();
const k = new Karateka3D({ cinturon: 'negro' }); esc.escena.add(k.raiz);
const logo = crearLogo(esc, k);
const rollo = crearRollo();
window.DURACION = 2.2;
window.render = (t) => {
  const g = U.parpadeo(t, [1.2], 0.35);
  logo.personaje(P, g > 0 ? { guino: g, sonrisa: LOGO.cara.sonrisa + 0.15 * g } : undefined);
  logo.actualizar(0);
  const p = U.prog(t, 0.05, 1.05);
  if (p >= 1) logo.dibujar(ctx, 0);
  else rollo.sol(ctx, p, (c) => logo.dibujar(c, 0), { cy: LOGO.cy });
  const a = U.prog(t, 1.0, 1.2) * (1 - U.prog(t, 1.75, 1.9));
  if (a > 0) {
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - U.easeOut(U.prog(t, 1.0, 1.2))) * 30);
    ctx.fillStyle = '#1A1A1A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 100px ${window.EMAKI.marca.fuente.titulo}`;
    ctx.fillText('Síguenos', 540, 1500);
    ctx.restore();
  }
};
</script></body></html>
