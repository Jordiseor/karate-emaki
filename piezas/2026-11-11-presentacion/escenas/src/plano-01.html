<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../../animacion/marca.js"></script>
<script type="module">
// Plano 1 (0-2,0 s): fotograma 0 = cara del logo (escala 1); 0,3-0,9 s el disco se va y la cámara retrocede; rei; tarjeta «KARATE EMAKI».
import { ctx, crearEscenario, Karateka3D, cargarPoses, mezclar, crearLogo, overlay, U } from './base-A.js';
const esc = crearEscenario({ escala: 1 });
const P = cargarPoses();
const k = new Karateka3D({ cinturon: 'negro' }); esc.escena.add(k.raiz);
const logo = crearLogo(esc, k);
window.DURACION = 2.0;
window.render = (t) => {
  const f = U.prog(t, 0.3, 0.9);
  logo.personaje(P);
  if (t > 0.3) {
    const g = U.easeInOut(f);
    k.colocar(0, 0, 12 * (1 - g));
    const r = Math.sin(Math.PI * U.prog(t, 0.95, 1.75));
    k.aplicarPose(mezclar(mezclar(P.yoi, P['pies-juntos'], g), P.rei, r));
    k.cara({ sonrisa: 0.85 - 0.5 * r, cejas: 0.35, parpadeo: U.parpadeo(t, [1.85]) });
  }
  logo.actualizar(f);
  logo.dibujar(ctx, f);
  overlay.tarjeta(ctx, t, { lineas: 'KARATE EMAKI', t0: 0.85, size: 96, abajo: true });
};
</script></body></html>
