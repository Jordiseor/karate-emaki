<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../../animacion/marca.js"></script>
<script type="module">
// Plano 8 (15,8–18,0 s): empieza donde acaba el 7 (último, gallo, y el bocadillo roto cayendo); el rollo se enrolla hacia el centro
// (0,05–0,95 s, suena a 15,85), se ata (0,85–1,3 s; golpe de madera a 1,3 = 17,1 s) y entra la tarjeta «KARATE EMAKI».
// El último fotograma (rollo cerrado y atado en (540, 900)) es el primero del plano 9.
import { crearToma, bocadilloRoto, U, T_GALLO, DUR7 } from './comun-c.js';
import { crearRollo } from '../../../../animacion/3d/rollo2d.js';
const ctx = document.getElementById('c').getContext('2d');
const toma = crearToma(), rollo = crearRollo();
window.DURACION = 2.2;
window.render = (t) => {
  const tt = DUR7 + t;
  const abierto = 1 - U.easeInOut(U.prog(t, 0.05, 0.95));
  window.EMAKI.fondoPapel(ctx);
  if (abierto > 0.001) {
    const vineta = (c) => {
      toma.escena(c, tt);
      c.save(); bocadilloRoto(c, 540, 540, 820, 300, '¡Ki-ai-iii…!', U.prog(tt, T_GALLO, T_GALLO + 0.5), { size: 100, tt: T_GALLO, temblor: 3 }); c.restore();
    };
    rollo.dibujar(ctx, { abierto, avance: 1, centrar: 1, vinetas: [null, vineta], atado: U.prog(t, 0.85, 1.3) });
  } else rollo.cerrado(ctx, { x: 540, y: 900, atado: U.prog(t, 0.85, 1.3) });
  // tarjeta «KARATE EMAKI»: etiqueta de papel atravesada sobre el rollo; se retira en los últimos 0,2 s para que el
  // último fotograma sea exactamente el rollo cerrado con el que abre el plano 9.
  const a = U.prog(t, 0.95, 1.2) * (1 - U.prog(t, 2.0, 2.2));
  if (a > 0) {
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - U.easeOut(U.prog(t, 0.95, 1.2))) * 40);
    ctx.fillStyle = '#FFFDF8'; ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 8; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.roundRect(70, 1160, 940, 170, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1A1A1A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 100px ${window.EMAKI.marca.fuente.titulo}`;
    ctx.fillText('KARATE EMAKI', 540, 1250);
    ctx.restore();
  }
};
</script></body></html>
