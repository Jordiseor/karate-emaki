<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Tigre · plano 07</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from "./comun.js";
const ctx = C.ctx2d(), { U, T } = C;
window.DURACION = 3.0;
// PLANO 7 (DATO): en el rollo abierto se escribe 'tora no maki' a pincel (0,2–1,4) la tarjeta superior ya dice «libro maestro» (cartela pequeña «libro de secretos» retirada el 23 nov por redundante).
const rollo = C.crearRollo();
let tt = 0;
const vineta = (c) => {
  T.rotulo(c, 'tora no maki', 540, 880, 96, U.prog(tt, 0.2, 1.4));
};
window.render = (t) => {
  tt = t; C.papel(ctx);
  rollo.dibujar(ctx, { abierto: 1, vinetas: [vineta], escala: 0.72, y: 185 });
  C.tarjeta(ctx, t, ['tora no maki:', 'libro maestro'], { t0: 0.1, y: 300 });
  C.etiqueta(ctx, t, 'DATO', { t0: 0.3, y: 520 });
};
</script></body></html>
