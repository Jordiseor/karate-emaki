<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../../../animacion/marca.js"></script>
<script type="module">
// Plano 1 (3 s): gancho. Fotograma 0 = puño de ao en el impacto controlado sobre aka. Marcador sube a 1.
import * as C from './comun.js';
const S = C.iniciar(); const { ctx, esc, par, P } = S, U = C.U;
const X = C.crearTecnica(par, P, 'gyaku-zuki-jodan', { atacante: 'ao' });
window.DURACION = 3;
const T = (t) => 0.7 + Math.max(0, t - 0.55);       // impacto en t=0; mantiene 0,55 s y vuelve a kamae
window.render = (t) => {
  const tt = Math.min(T(t), 1.2); X.poner(tt);
  S.aka.cara({ ojos: 0.8, cejas: 0.6, parpadeo: 0 }); S.ao.cara({ cejas: -0.7, grito: 0.5, parpadeo: 0 });
  const c = X.camara; C.cam(S, { ...c, centro: [c.centro[0], 0.85, 0], distancia: 9.4 + 1.4 * U.easeInOut(U.prog(t, 0, 3)) });
  esc.dibujar(ctx, {});
  C.rastro(S, S.ao, tt, { desde: 0.45, hasta: 0.7, alfa: 1 - U.clamp((t - 0.7) / 0.5), poner: (x) => X.poner(x) });
  C.marcador(ctx, 1, { y: 420, pop: Math.max(0, 1 - t / 0.4) });
  C.tarjeta(ctx, t, ['¿Punto?'], { size: 80, y: 505, t0: -1 });
  C.aviso(ctx);
};
</script></body></html>
