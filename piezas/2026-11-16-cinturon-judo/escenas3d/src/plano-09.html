<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Cinturón judo · plano 09</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, k, P, U } = C.iniciar();
window.DURACION = 2.5;
// PLANO 9 (23,0–25,5): colores por tramos (amarillo, naranja, verde) con corte seco y rebote cada 0,5 s. Inglaterra, 1926.
// Cámara desplazada (centro x 0,3) para dejar sitio a Kawaishi en el plano 10 (misma cámara: corte limpio).
const CAMARA = { ...C.CAM.medio, centro: [0.3, 1.2, 0] };
window.render = (t) => {
  k.colocar(0, 0, 0);
  C.cinturonPorTramos(k, t, [[0, 'amarillo'], [0.5, 'naranja'], [1.0, 'verde']]);
  k.aplicarPose(P.yoi);
  k.cara({ parpadeo: U.parpadeo(t, [1.7]), sonrisa: 0.25, cejas: 0.2, mirada: [0, 0] });
  const dt = t - Math.floor(t * 2) / 2, reb = t >= 0.5 ? 0.04 * Math.max(0, 1 - dt / 0.18) : 0;   // rebote en cada corte
  esc.orbita({ ...CAMARA, distancia: CAMARA.distancia * (1 - reb) });
  esc.dibujar(ctx, {});
  C.tarjeta(ctx, t, ['Los colores', 'llegaron después'], { t0: 0.1, t1: 1.3, y: 300 });
  C.tarjeta(ctx, t, ['Inglaterra,', '[r]1926[/r]'], { t0: 1.3, y: 300 });
};
</script></body></html>
