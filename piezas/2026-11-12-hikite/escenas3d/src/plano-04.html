<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Hikite · plano 04</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, k, P, U } = C.iniciar();
window.DURACION = 2.5;
// PLANO 4: perfil, la cámara se acerca; el hikite llega a la cadera a 1,5 s, pausa 0,25 s con rebote y destello rojo.
const f = (t) => 0.3 + 0.7 * U.easeInOut(U.prog(t, 0, 1.5));
const poseEn = (t) => C.golpe(P, f(t));
window.render = (t) => {
  k.colocar(0, 0, -90);
  k.aplicarPose(poseEn(t));
  k.cara({ parpadeo: U.parpadeo(t, [2.1]), cejas: -0.2, sonrisa: 0, mirada: [-0.3, 0] });
  const q = U.easeInOut(U.prog(t, 0, 2.5));
  const rebote = t >= 1.5 ? 0.04 * Math.sin(Math.PI * U.prog(t, 1.5, 1.75)) : 0;   // rebote de cámara en la pausa
  // la cámara se detiene en la pausa y retoma al soltarse
  const qc = U.easeInOut(U.prog(t < 1.5 ? t : t < 1.75 ? 1.5 : 1.5 + (t - 1.75) * 0.9, 0, 2.4));
  esc.orbita({ ...C.CAM.perfil, distancia: 7.2 + (5.0 - 7.2) * qc - rebote, centro: [0, 1.0 + 0.2 * qc, 0] });
  esc.dibujar(ctx, {});
  // rastro rojo hasta la llegada
  const a = 1 - U.prog(t, 1.5, 1.8);
  if (a > 0) C.rastro(ctx, esc, k, (ti) => poseEn(Math.min(ti, 1.5)), Math.min(t, 1.5), { punto: 'manoI', cola: 0.6, alfa: a });
  // destello rojo breve en la mano
  const g = U.prog(t, 1.5, 1.85);
  if (g > 0 && g < 1) {
    const m = esc.proyectar(k.punto('manoI'));
    ctx.save(); ctx.strokeStyle = C.ROJO; ctx.globalAlpha = 0.9 * (1 - g); ctx.lineWidth = 12 * (1 - g) + 2;
    ctx.beginPath(); ctx.arc(m.x, m.y, 40 + 110 * U.easeOut(g), 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = C.ROJO; ctx.globalAlpha = 0.35 * (1 - g); ctx.beginPath(); ctx.arc(m.x, m.y, 40 + 60 * g, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  C.tarjeta(ctx, t, ['Que recorra', 'todo el trayecto'], { t0: 0.1, y: 270 });
};
</script></body></html>
