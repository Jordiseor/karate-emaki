<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Hikite · plano 07</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from "./comun.js";
const { ctx, esc, k, P, U } = C.iniciar();
const r = new C.Karateka3D({ cinturon: 'negro' }); r.silueta('#1A1A1A'); esc.escena.add(r.raiz);
window.DURACION = 2.5;
// PLANO 7: bunkai. Karateka en guardia 3/4 y rival silueta a distancia de brazo (misma colocación que el caso «agarre»).
const RUMBO = 90 - 0, AZ = 0;
window.render = (t) => {
  k.colocar(0, 0, 0); k.aplicarPose(P['agarre-brazo']); const mano = k.punto('manoI').clone();
  k.aplicarPose(P['zenkutsu-dachi']);
  // rival: su manoD coincide con la manoI del agarre (caso 'agarre' de poses-2026-11-16.html, rumbo -90)
  const rumbo = 90, a = rumbo * Math.PI / 180;
  r.colocar(0, 0, 180); r.aplicarPose(P['rival-brazo-extendido'], { suelo: true });
  const base = r.punto('manoD'), tx = mano.x - base.x, tz = mano.z - base.z;
  const X = tx * Math.cos(a) + tz * Math.sin(a), Z = -tx * Math.sin(a) + tz * Math.cos(a);
  const ent = U.easeOut(U.prog(t, 0.2, 0.9));
  r.colocar(X + 0.6 * (1 - ent) * Math.sin(a), Z + 0.6 * (1 - ent) * Math.cos(a), 180 + rumbo);
  r.aplicarPose(P['rival-brazo-extendido'], { suelo: true });
  r.raiz.visible = ent > 0.02;
  r.raiz.traverse((o) => { if (o.material) { const m = Array.isArray(o.material) ? o.material : [o.material]; m.forEach((q) => { q.transparent = true; q.opacity = ent; }); } });
  k.colocar(0, 0, 90);
  k.aplicarPose({ ...P['zenkutsu-dachi'], tronco: { inclina: 1.5 * Math.sin(t * 2.4) } });
  k.cara({ parpadeo: U.parpadeo(t, [1.7]), cejas: -0.3, sonrisa: 0, mirada: [0.3, 0] });
  esc.orbita({ centro: [X * 0.5, 1.2, Z * 0.5], distancia: 7.4 - 0.3 * U.prog(t, 0, 2.5), azimut: 0, elevacion: 4, fov: 26 });
  esc.dibujar(ctx, {});
  // pergamino arriba; tarjeta lo sustituye tras 1,0 s
  if (t < 1.0) H2_p(ctx, t); else C.tarjeta(ctx, t, ['Razón dos:', 'el bunkai'], { t0: 1.0, y: 290 });
};
function H2_p(ctx, t) { C.H2.pergamino(ctx, t, { texto: 'Bunkai', t0: 0, t1: 0.5, y: 290 }); }
</script></body></html>
