<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Hikite · plano 01</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from './comun.js';
const { ctx, esc, k, P, U } = C.iniciar();
window.DURACION = 2.5;
// PLANO 1 (0,0–2,5) gancho: 3/4 desde el lado del hikite; gyaku-zuki en cámara lenta ya iniciado en t=0 (f≈0,63).
// el movimiento empezó 0,5 s antes de t=0: así hay rastro ya en el fotograma 0 (f≈0,63)
const f = (t) => 0.3 + 0.7 * U.easeOut(U.prog(t + 0.5, 0, 2.6));
const poseEn = (t) => C.golpe(P, f(t));
window.render = (t) => {
  k.colocar(0, 0, C.RUMBO_34);
  k.aplicarPose(poseEn(t));
  k.cara({ parpadeo: U.parpadeo(t, [1.6]), cejas: -0.35, sonrisa: 0, mirada: [-0.3, 0] });
  // deriva lenta de cámara (empuje); en t=0 la cámara es exactamente C.CAM.tres4 (el plano 11 acaba igual)
  const c = C.CAM.tres4;
  esc.orbita({ ...c, distancia: c.distancia - 0.25 * U.easeInOut(U.prog(t, 0, 2.5)), azimut: 0 });
  esc.dibujar(ctx, {});
  // rastro rojo del brazo de retorno (mano izquierda → cadera), se apaga al llegar
  const a = 1 - U.prog(t, 1.6, 2.4);
  if (a > 0) C.rastro(ctx, esc, k, poseEn, t, { punto: 'manoI', cola: 0.55, alfa: a });
  C.tarjeta(ctx, t, ['¿Y el brazo', 'que NO golpea?'], { t0: -1, y: 270 });
};
</script></body></html>
