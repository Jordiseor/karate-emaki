<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Hikite · plano 05</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../../../animacion/marca.js"></script>
<script type="module">
import * as C from "./comun.js";
const { ctx, esc, k, P, d, U } = C.iniciar();
window.DURACION = 2.5;
// PLANO 5: frontal; un brazo sale, el otro vuelve. Dos flechas de igual longitud y mismo crecer.
const f = (t) => 0.1 + 0.9 * U.easeInOut(U.prog(t, 0.2, 2.2));
const poseEn = (t) => { const p = C.golpe(P, f(t)); p.tronco = { ...p.tronco, inclina: 5 * f(t), giro: 0 }; return p; };
window.render = (t) => {
  k.colocar(0, 0, 0);
  k.aplicarPose(poseEn(t));
  k.cara({ parpadeo: U.parpadeo(t, [1.9]), cejas: -0.3, sonrisa: 0, mirada: [0, 0] });
  const c = C.CAM.frontal;
  esc.orbita({ ...c, centro: [0, 1.05, 0.3], azimut: 36 - 6 * U.easeInOut(U.prog(t, 0, 2.5)), distancia: c.distancia - 0.2 * U.prog(t, 0, 2.5) });
  d.limpiar();
  const cr = U.easeOut(U.prog(t, 0.3, 1.3)), L = 0.45;
  const mD = k.punto('manoD'), mI = k.punto('manoI');
  d.flecha({ desde: [mD.x - 0.12, mD.y + 0.16, mD.z + 0.05], hacia: [mD.x - 0.12, mD.y + 0.16, mD.z + 0.05 + L], crecer: cr });
  d.flecha({ desde: [mI.x + 0.12, mI.y + 0.16, mI.z + 0.05], hacia: [mI.x + 0.12, mI.y + 0.16, mI.z + 0.05 - L], crecer: cr });
  esc.dibujar(ctx, {});
  d.dibujar2D(ctx);
  C.tarjeta(ctx, t, ['Uno sale,', 'otro vuelve'], { y: 270 });
};
</script></body></html>
