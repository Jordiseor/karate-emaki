<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../../animacion/marca.js"></script>
<script type="module">
// Plano 1 (3 s): suelo vacío cenital; el karateka entra en hachiji-dachi, gira a la izquierda y deja la 1.ª huella roja (t=2,1).
import { ctx, U, MAPA as P, suelo, huellas, karatekaArriba, tarjeta, aparece } from './comun.js';
window.DURACION = 3;
window.render = (t) => {
  suelo(ctx);
  const ent = U.easeInOut(U.prog(t, 0.3, 1.1));              // entra desde abajo
  const gi = U.easeInOut(U.prog(t, 1.4, 1.9)), mv = U.easeInOut(U.prog(t, 1.8, 2.15));
  if (t > 1.0) huellas(ctx, P, 0, { alfa: 1 });
  if (t > 2.1) huellas(ctx, P, 1, { sello: 1 + 0.35 * Math.max(0, 1 - (t - 2.1) / 0.18) });
  const x = P[0].x + (P[1].x - P[0].x) * mv, y = P[0].y + (P[1].y - P[0].y) * mv + (1 - ent) * 700;
  karatekaArriba(ctx, x, y, -90 * gi, 1.35, { alfa: U.clamp(ent * 2) });
  const a = aparece(t, 0.2); tarjeta(ctx, '¿Qué dibuja esta kata?', 340, 66, a.alfa, a.desliz);
};
</script></body></html>
