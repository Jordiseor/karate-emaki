<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="../../../../animacion/marca.js"></script>
<script type="module">
// Plano 2 (3 s): pasos 1-9 en time-lapse (el 1 ya está hecho). Un paso cada 0,24 s; kiai en el 9 (t=2,28).
import { ctx, U, MAPA as P, suelo, huellas, karatekaArriba, tarjeta, aparece, kiai, rotulo, texto } from './comun.js';
window.DURACION = 3;
const T0 = 0.2, DT = 0.25, tp = (n) => T0 + (n - 2) * DT; // instante de llegada del paso n (2..9)
window.render = (t) => {
  suelo(ctx);
  huellas(ctx, P, 0);
  for (let n = 1; n <= 9; n++) if (n === 1 || t >= tp(n)) huellas(ctx, P, n, { sello: n > 1 ? 1 + 0.3 * Math.max(0, 1 - (t - tp(n)) / 0.15) : 1 });
  let hasta = 1; for (let n = 2; n <= 9; n++) hasta = Math.max(hasta, n - 1 + U.easeInOut(U.prog(t, tp(n) - DT * 0.8, tp(n))));
  const i = Math.min(8, Math.floor(hasta)), f = hasta - i, a = P[i], b = P[i + 1];
  const golpe = Math.max(0, 1 - Math.abs(((t - T0) / DT) % 1 - 0.5) * 2);
  karatekaArriba(ctx, a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, a.a + (b.a - a.a) * f, 1.35);
  kiai(ctx, P[9].x, P[9].y, U.prog(t, tp(9), tp(9) + 0.55));
  const q = aparece(t, 0.15); tarjeta(ctx, '21 movimientos', 340, 72, q.alfa, q.desliz);
  rotulo(ctx, 'embusen', 1470, U.clamp(U.prog(t, 0.9, 1.2)));
  if (t > tp(9)) texto(ctx, 'kiai', P[9].x, P[9].y - 100, 56, { color: '#C8102E', halo: 12, alfa: U.clamp(U.prog(t, tp(9), tp(9) + 0.15)) });
};
</script></body></html>
